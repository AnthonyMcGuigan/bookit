.mrow { display: block; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; }
button.mrow:active { background: var(--card2); }
.mrow.me { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 10%, transparent), transparent); }
.mrow-h { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.mpos { font-size: 10.5px; font-weight: 900; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.mrow.me .mpos { color: var(--accent-t); }
.mrate { font-size: 12px; } .mrate i { font-style: normal; color: var(--faint); font-size: 10px; text-transform: uppercase; font-weight: 700; }
.mvs { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }
.mside { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mside.r { align-items: flex-end; text-align: right; }
.mw { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; min-width: 0; max-width: 100%; }
.mw span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mw .av { flex: none; }
.mw.won span { text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 3px; }
.vsb { font-size: 11px; font-weight: 900; color: var(--faint); background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; }
.mmulti { font-weight: 700; font-size: 14px; }
.mchips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.mchips span { font-size: 11px; color: var(--dim); background: var(--bg2); border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
.mchips .gold { color: var(--accent-t); background: none; padding: 0; }
.mres { font-size: 12.5px; color: var(--dim); margin-top: 6px; }
.mrow .ctl { display: flex; gap: 6px; margin-top: 8px; }
.addrow { display: grid; grid-template-columns: repeat(3, 1fr); }
.addrow button { border: 0; border-right: 1px solid var(--line); background: none; padding: 12px 4px; font-weight: 700; color: var(--accent-t); font-size: 14px; }
.addrow button:last-child { border-right: 0; }
.addrow b { font-weight: 900; }
.ghost { border-top: 1px dashed var(--line); padding: 9px 12px; font-size: 12px; color: var(--faint); text-align: center; }
.runbar { position: sticky; bottom: calc(62px + env(safe-area-inset-bottom)); padding: 8px 0; background: linear-gradient(transparent, var(--bg) 30%); z-index: 4; }
.runbar .btn { min-height: 52px; font-size: 16px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.runproj { font-weight: 600; opacity: .8; font-size: 13px; }
@media (max-width: 360px) { .cal-n { font-size: 17px; } .mw { font-size: 13px; } }
/* ----- character builder, roster tools, community ----- */
.btn.tool { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 56px; font-size: 12px; }
.btn.tool b { font-size: 18px; line-height: 1; color: var(--accent-t); }
.bld-hero { display: flex; gap: 14px; align-items: center; margin-bottom: 10px; }
.bld-photo { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; color: var(--accent-t); }
.bld-photo .av { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--line); }
.bld-name { font-size: 20px !important; font-weight: 800; margin-bottom: 6px; }
.bld-nick { font-size: 14px; min-height: 38px !important; }
.bld-ovr { margin-top: 6px; font-size: 12px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
.bld-ovr b { font-size: 22px; color: var(--accent-t); margin-left: 4px; font-variant-numeric: tabular-nums; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); }
.sw.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
.sl { display: grid; grid-template-columns: 92px 1fr 34px; align-items: center; gap: 4px 10px; margin-bottom: 10px; }
.sl label { font-weight: 700; font-size: 14px; }
.sl input[type=range] { width: 100%; accent-color: var(--accent); }
.sl output { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.sl small { grid-column: 2 / 4; font-size: 11px; color: var(--faint); margin-top: -6px; }
.chip { cursor: pointer; }
pre.ex { background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 11.5px; overflow-x: auto; margin: 0 0 6px; }
img.av { display: block; }
/* ----- welcome sequence + draft ----- */
.wz { padding-top: calc(env(safe-area-inset-top) + 18px); }
.wz-belt { font-size: 56px; filter: drop-shadow(0 6px 18px color-mix(in srgb, var(--accent) 45%, transparent)); }
.wz-lead { font-size: 16px; max-width: 420px; margin: 10px auto 6px; }
.wz-cta { min-height: 54px; font-size: 17px; }
.wz-steps { display: flex; gap: 6px; margin: 4px 0 18px; }
.wz-steps span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.wz-steps span.done { background: color-mix(in srgb, var(--accent) 55%, var(--line)); } .wz-steps span.on { background: var(--accent); }
.wz-k { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-t); margin-bottom: 4px; }
.wz-h { font-size: 24px; font-weight: 850; letter-spacing: -.4px; margin-bottom: 14px; text-wrap: balance; }
.wz-preview { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; margin-bottom: 14px; }
.wz-logo { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-weight: 900; font-size: 15px; letter-spacing: .02em; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.4); flex: none; }
.wz-opt { border: 1px solid var(--line) !important; border-radius: 12px; padding: 12px; background: var(--card); align-items: flex-start; }
.wz-opt .ck { margin-top: 2px; }
.wz-nav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 18px; position: sticky; bottom: 0; padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 25%); }
.wz-story { margin-top: 6px; }
.seg-ctl button { min-width: 0; }
.dr-head { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(env(safe-area-inset-top) + 8px) 0 8px; margin: -18px 0 8px; border-bottom: 1px solid var(--line); }
.dr-head .wz-logo { width: 40px; height: 40px; font-size: 12px; border-radius: 10px; }
.dr-pay { margin-top: 8px; } .dr-pay .bad { color: var(--bad); font-weight: 700; }
.needs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.need { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
.need.met { color: var(--good); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.dr-log { font-size: 12.5px; color: var(--dim); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 3px; }
.dr-row { display: flex; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.dr-row.dis { opacity: .5; }
.dr-row .main { flex: 1; min-width: 0; } .dr-row .t { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dr-stats { display: flex; flex-wrap: wrap; gap: 3px 8px; font-size: 11.5px; color: var(--dim); }
.dr-r { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; }
.dr-ovr { font-size: 22px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.dr-bar { bottom: 0; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
.tut-dots { display: flex; gap: 4px; margin: 6px 0 8px; } .tut-dots i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); } .tut-dots i.ok { background: color-mix(in srgb, var(--gold) 55%, var(--line)); } .tut-dots i.on { background: var(--gold); }
.tut-hi { outline: 3px solid var(--gold) !important; outline-offset: -3px; animation: tutPulse 1.6s ease-in-out infinite; }
@keyframes tutPulse { 50% { outline-color: color-mix(in srgb, var(--gold) 35%, transparent); } }
.btn.pri.tut-hi { outline-color: currentColor !important; outline-offset: -5px; animation-name: tutPulseInk; } @keyframes tutPulseInk { 50% { outline-color: transparent; } }
.lv-tut { margin: 12px 0 2px; padding: 10px; border-radius: var(--r); border: 1px solid var(--gold); background: color-mix(in srgb, var(--gold) 14%, transparent); }
.tip { background: color-mix(in srgb, var(--accent) 14%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius: var(--r); padding: 12px; margin-bottom: 10px; }
/* ===================== ARENA THEME (wrestling look) ===================== */
:root {
  --bg: #0c0b12; --bg2: #15131e; --card: #1b1826; --card2: #252134; --line: #322d45;
  --gold: #f6c544; --gold-ink: #2a1c00; --belt-strap: #241a12;
  --rope-r: #e53945; --rope-w: #f1f1f4; --rope-b: #2f6fe0;
  --f-display: "Anton", Impact, "Arial Narrow Bold", "Helvetica Neue Condensed", sans-serif;
  --f-cond: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --spot1: rgba(255, 236, 190, .10); --spot2: rgba(170, 200, 255, .07);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f2eee6; --bg2: #e9e3d8; --card: #fffdf9; --card2: #f6f1e8; --line: #ddd3c3;
    --gold: #8a5c05; --rope-w: #c3c6d2; --spot1: rgba(255, 200, 90, .16); --spot2: rgba(90, 140, 255, .08);
  }
}
:root[data-theme="light"] {
  --bg: #f2eee6; --bg2: #e9e3d8; --card: #fffdf9; --card2: #f6f1e8; --line: #ddd3c3;
  --gold: #8a5c05; --rope-w: #c3c6d2; --spot1: rgba(255, 200, 90, .16); --spot2: rgba(90, 140, 255, .08);
}
body { background: var(--bg); }
body::before { content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(42% 34% at 18% -6%, var(--spot1), transparent 72%),
    radial-gradient(42% 34% at 82% -6%, var(--spot2), transparent 72%),
    radial-gradient(70% 40% at 50% 110%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%); }
.app { position: relative; z-index: 1; }
/* three ring ropes: red, white, blue */
.ropes, header.top::after, nav.tabs::before, .modal .mh::after { background:
  linear-gradient(var(--rope-r) 0 2px, transparent 2px 4px, var(--rope-w) 4px 6px, transparent 6px 8px, var(--rope-b) 8px 10px); }
header.top { border-bottom: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); position: sticky; }
header.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 10px; opacity: .9; pointer-events: none; }
.top .brand b { font-family: var(--f-display); font-weight: 400; font-size: 20px; letter-spacing: .02em; text-transform: uppercase; line-height: 1.05; }
.top .brand span { font-family: var(--f-cond); font-weight: 600; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; }
.top-logo { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; font-family: var(--f-display); font-size: 13px; letter-spacing: .02em; color: var(--accent-ink); background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 70%, #fff), var(--accent) 55%, color-mix(in srgb, var(--accent) 70%, #000)); box-shadow: inset 0 0 0 2px rgba(255,255,255,.18), 0 2px 10px color-mix(in srgb, var(--accent) 35%, transparent); }
.money { font-family: var(--f-display); font-weight: 400; font-size: 17px; letter-spacing: .02em; }
header.top { margin-bottom: 22px; }
/* bottom nav: the ring apron */
nav.tabs { background: color-mix(in srgb, var(--bg2) 94%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-top: 0; padding-top: 14px; }
nav.tabs::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px; }
nav.tabs button { font-family: var(--f-cond); font-size: 12.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
nav.tabs button.on::after { content: ""; position: absolute; bottom: -2px; left: 30%; right: 30%; height: 3px; border-radius: 2px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
nav.tabs button.on .ic { transform: translateY(-1px) scale(1.08); filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 60%, transparent)); }
nav.tabs .dot { background: var(--rope-r); font-family: system-ui, sans-serif; letter-spacing: 0; }
/* type */
.sec { font-family: var(--f-cond); font-size: 15px; font-weight: 800; letter-spacing: .08em; color: var(--ink); }
.sec::before { content: ""; width: 4px; height: 15px; border-radius: 1px; background: var(--accent); transform: skewX(-14deg); flex: none; }
.card h3, .modal .mh h2 { font-family: var(--f-display); font-weight: 400; letter-spacing: .03em; text-transform: uppercase; }
.card h3 { font-size: 17px; }
.modal .mh h2 { font-size: 21px; }
.modal .mh { position: relative; border-bottom: 0; padding-bottom: 18px; }
.modal .mh::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 10px; opacity: .85; }
.modal { background: var(--bg); box-shadow: 0 -10px 40px rgba(0,0,0,.45); }
.stat .k, label.f > span, .show-k, .mpos, .mcard-h, .cal-d, .wz-k { font-family: var(--f-cond); font-weight: 700; letter-spacing: .08em; }
.stat .v, .dr-ovr, .res-score, .show-score b, .bld-ovr b, .cal-n { font-family: var(--f-display); font-weight: 400; letter-spacing: .01em; }
.stat .v { font-size: 22px; }
/* buttons */
.btn { font-family: var(--f-cond); font-weight: 700; font-size: 15.5px; letter-spacing: .04em; text-transform: uppercase; border-radius: 10px; }
.btn.sm { font-size: 13.5px; }
.btn.pri { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 78%, #fff), var(--accent) 48%, color-mix(in srgb, var(--accent) 82%, #000));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -2px 0 rgba(0,0,0,.18), 0 4px 16px color-mix(in srgb, var(--accent) 30%, transparent); }
.btn.pri:active { transform: translateY(1px); }
.runbar .btn.pri { min-height: 56px; font-family: var(--f-display); font-weight: 400; font-size: 19px; letter-spacing: .04em; }
.runproj { font-family: var(--f-cond); font-weight: 700; letter-spacing: .02em; }
.link { font-family: var(--f-cond); font-size: 14px; letter-spacing: .04em; text-transform: uppercase; }
.filters button, .seg-ctl button, .addrow button { font-family: var(--f-cond); font-weight: 700; letter-spacing: .04em; text-transform: uppercase; font-size: 14px; }
.filters button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.seg-ctl button.on { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
/* cards */
.card, .item, .mcard, .cal, .stat, .dr-row, .wz-preview { box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 2px 10px rgba(0,0,0,.12); }
/* stars and gold */
.stars, .cal-r { color: var(--gold); text-shadow: 0 0 10px color-mix(in srgb, var(--gold) 35%, transparent); }
.tag.gold { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 45%, transparent); }
/* the title belt chip: gold plate with leather strap ends */
.belt { display: inline-flex; align-items: center; gap: 4px; position: relative; margin: 0 7px; padding: 1px 8px; border-radius: 5px;
  font-family: var(--f-cond); font-weight: 800; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; line-height: 1.5;
  color: #2a1c00 !important; background: linear-gradient(180deg, #fff1b0, #f2c443 45%, #b98512) !important;
  box-shadow: inset 0 0 0 1px rgba(120,80,0,.45), -7px 0 0 -2px var(--belt-strap), 7px 0 0 -2px var(--belt-strap); }
.belt::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ffd7d7, #d62839 60%, #7a0c18); box-shadow: 0 0 0 1px rgba(90,60,0,.6); }
.mchips span.belt { padding: 1px 8px; }
/* avatars get a face or heel ring */
.av.av-face { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--face); }
.av.av-heel { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--heel); }
/* calendar */
.cal-h b { font-family: var(--f-display); font-weight: 400; font-size: 18px; letter-spacing: .04em; text-transform: uppercase; }
.cal-n { font-size: 21px; }
.cal-s { font-family: var(--f-cond); font-size: 11px; letter-spacing: .02em; text-transform: uppercase; }
.cal-t.big { background: linear-gradient(170deg, color-mix(in srgb, var(--gold) 24%, var(--bg2)), var(--bg2) 70%); border-color: color-mix(in srgb, var(--gold) 65%, var(--line)); position: relative; overflow: hidden; }
.cal-t.big::before { content: "PPV"; position: absolute; top: 0; right: 0; font: 800 8px/1 var(--f-cond); letter-spacing: .06em; padding: 2px 4px; background: var(--gold); color: var(--gold-ink); border-bottom-left-radius: 6px; }
.cal-t.big .cal-s { color: var(--gold); }
.cal-now { color: var(--rope-r); font-family: var(--f-cond); font-size: 11px; display: inline-flex; align-items: center; gap: 3px; }
.cal-now::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--rope-r); animation: live 1.4s ease-in-out infinite; }
@keyframes live { 50% { opacity: .25; } }
.cal-t.sel { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 80%, #fff), var(--accent)); box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
.cal-t.sel::before { background: var(--accent-ink); color: var(--accent-t); }
.cal-t.sel .cal-now::before { background: var(--accent-ink); }
/* show header: the event poster */
.show-h { position: relative; overflow: hidden; margin: 0 0 10px; padding: 14px 14px 12px; border-radius: var(--r); border: 1px solid var(--line);
  background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 60%), linear-gradient(160deg, var(--card2), var(--card)); }
.show-h::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, var(--rope-r) 0 33.3%, var(--rope-w) 33.3% 66.6%, var(--rope-b) 66.6%); opacity: .85; }
.show-h h2 { font-family: var(--f-display); font-weight: 400; font-size: 30px; letter-spacing: .02em; text-transform: uppercase; line-height: 1; margin: 4px 0 6px; text-wrap: balance; }
.show-h.big { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); background:
  repeating-linear-gradient(115deg, transparent 0 22px, color-mix(in srgb, var(--gold) 6%, transparent) 22px 44px),
  radial-gradient(110% 100% at 100% 0%, color-mix(in srgb, var(--gold) 28%, transparent), transparent 60%), linear-gradient(160deg, var(--card2), var(--card)); }
.show-h.big h2 { color: transparent; background: linear-gradient(180deg, #fff3c2, #f6c544 50%, #c78a12); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
.show-h.big .show-k::after { content: " · Premium live event"; color: var(--gold); }
.show-score { background: linear-gradient(180deg, #1f1c2b, #0f0d16); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 8px 6px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.show-score .stars { color: #f6c544; }
.item .t { font-family: var(--f-cond); font-size: 17.5px; font-weight: 700; letter-spacing: .01em; }
.item .t.small { font-size: 15.5px; }
.show-score b { font-size: 34px; color: #fff; }
.show-score .tiny { color: rgba(255,255,255,.65) !important; font-family: var(--f-cond); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
/* match card */
.mcard-h { font-size: 13px; color: var(--ink); background: var(--card2); }
.mpos { font-size: 12px; }
.mrow { padding: 10px 12px; position: relative; }
.mrow.title-m { box-shadow: inset 3px 0 0 var(--gold); }
.mw { font-family: var(--f-cond); font-weight: 700; font-size: 17px; letter-spacing: .01em; }
.mmulti { font-family: var(--f-cond); font-weight: 700; font-size: 16.5px; }
.mside { gap: 7px; }
.vsb { font-family: var(--f-display); font-weight: 400; font-size: 17px; letter-spacing: .02em; padding: 2px 8px; border: 0; border-radius: 6px; transform: skewX(-10deg);
  color: #fff; background: linear-gradient(135deg, var(--rope-r), color-mix(in srgb, var(--rope-r) 50%, var(--rope-b)) 50%, var(--rope-b)); box-shadow: 0 2px 8px rgba(0,0,0,.3); }
.vs { font-family: var(--f-display); font-weight: 400; color: #ff5c68; font-size: 14px; }
:root[data-theme="light"] .vs { color: #c4202f; }
@media (prefers-color-scheme: light) { :root:not([data-theme]) .vs { color: #c4202f; } }
.mrow.me { padding: 14px 12px 12px; background:
  radial-gradient(80% 120% at 50% 0%, color-mix(in srgb, var(--gold) 16%, transparent), transparent 70%), linear-gradient(180deg, color-mix(in srgb, var(--gold) 6%, transparent), transparent); }
.mrow.me .mpos { color: var(--gold-ink); background: linear-gradient(180deg, #ffe99a, #f2c443 50%, #c48e14); padding: 2px 10px; border-radius: 4px; font-family: var(--f-display); font-weight: 400; font-size: 13px; letter-spacing: .08em; }
.mrow.me .mw { font-size: 19px; }
.mchips span { font-family: var(--f-cond); font-weight: 600; font-size: 12.5px; letter-spacing: .02em; }
.mres { font-style: italic; }
.addrow button { padding: 13px 4px; }
/* results + recap */
.res-score { font-size: 64px; color: var(--gold); text-shadow: 0 4px 24px color-mix(in srgb, var(--gold) 35%, transparent); }
/* start screen: the ring */
.hero { padding-top: calc(env(safe-area-inset-top) + 18px); }
.hero h1 { font-family: var(--f-display); font-weight: 400; font-size: 46px; letter-spacing: .02em; text-transform: uppercase; line-height: .95; }
.hero h1 em { display: block; font-size: 62px; color: transparent; background: linear-gradient(180deg, #fff3c2, #f6c544 50%, #c78a12); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 4px 14px rgba(246,197,68,.25)); }
.ring-art { width: min(300px, 82vw); height: auto; display: block; margin: 0 auto 6px; filter: drop-shadow(0 18px 30px rgba(0,0,0,.45)); }
.belt-art { width: min(240px, 70vw); height: auto; display: block; margin: 6px auto 10px; filter: drop-shadow(0 10px 24px rgba(246,197,68,.28)); }
.belt-sm { width: 64px; height: auto; flex: none; }
/* wizard + draft */
.wz-h { font-family: var(--f-display); font-weight: 400; font-size: 30px; letter-spacing: .02em; text-transform: uppercase; line-height: 1.02; }
.wz-k { font-size: 13px; }
.wz-logo { font-family: var(--f-display); font-weight: 400; letter-spacing: .03em; font-size: 17px; box-shadow: inset 0 0 0 2px rgba(255,255,255,.2); }
.wz-steps span.on { box-shadow: 0 0 8px var(--accent); }
.dr-row .t { font-family: var(--f-cond); font-size: 17px; }
.dr-ovr { font-size: 28px; }
.need { font-family: var(--f-cond); font-size: 12.5px; letter-spacing: .03em; }
/* toasts as TV lower-thirds */
.toast { background: linear-gradient(90deg, #111 0, #1d1d26); color: #fff; border-left: 4px solid var(--accent); border-radius: 6px; font-family: var(--f-cond); font-weight: 700; font-size: 16px; letter-spacing: .02em; }
/* the bell when a show starts */
.bell { position: fixed; inset: 0; z-index: 60; pointer-events: none; display: grid; place-items: center; background: radial-gradient(circle, rgba(0,0,0,.55), rgba(0,0,0,0) 70%); animation: bellfade 1.3s ease-out forwards; }
.bell div { text-align: center; color: #fff; font-family: var(--f-display); font-size: 44px; letter-spacing: .04em; line-height: 1; text-shadow: 0 4px 20px rgba(0,0,0,.6); animation: bellpop .5s cubic-bezier(.2,1.6,.4,1); }
.bell span { display: block; font-size: 64px; animation: ring .22s ease-in-out 3; }
@keyframes bellfade { 0%, 60% { opacity: 1; } 100% { opacity: 0; } }
@keyframes bellpop { from { transform: scale(.6); opacity: 0; } }
@keyframes ring { 25% { transform: rotate(-16deg); } 75% { transform: rotate(16deg); } }
@media (prefers-reduced-motion: reduce) { .bell, .bell div, .bell span, .cal-now::before, .modal.anim { animation: none !important; } .bell { display: none; } }
@media (max-width: 360px) { .show-h h2 { font-size: 25px; } .hero h1 em { font-size: 52px; } .mw { font-size: 15.5px; } }

/* ----- polish after the month-long playtest ----- */
.mchips .hint { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.rwho { font-family: var(--f-cond); font-weight: 700; font-size: 16px; margin-top: 4px; }
.rwho .vs { margin: 0 3px; }
.heads, .review { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-size: 13.5px; display: flex; flex-direction: column; gap: 4px; }
.review { border-color: color-mix(in srgb, var(--gold) 50%, var(--line)); background: linear-gradient(170deg, color-mix(in srgb, var(--gold) 12%, var(--card)), var(--card)); }
.review-h { font-family: var(--f-display); font-size: 16px; letter-spacing: .04em; text-transform: uppercase; color: var(--gold); margin-bottom: 2px; }
.heads .review-h { color: var(--ink); }
.review .grid3 > div { display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,.12); border-radius: 8px; padding: 6px 2px; }
.review .grid3 b { font-family: var(--f-display); font-weight: 400; font-size: 20px; }
.review .grid3 span { font-family: var(--f-cond); font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); }
.sugg { color: var(--gold); font-weight: 700; }
.wz-draft .needs { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-top: 6px; }
.wz-draft .needs::-webkit-scrollbar { display: none; }
.wz-draft .need { flex: none; }
.wz-draft .dr-pay { margin-top: 4px; }
.dr-bar .btn { min-height: 40px; font-size: 14px; padding: 6px 10px; }
.dr-bar .btn.pri { min-height: 46px; font-size: 16px; }
.dr-bar .grid2 { gap: 8px; }
.wz-draft .dr-head .wz-logo { width: 34px; height: 34px; font-size: 12px; }

/* ----- launch: crash screen, small screens ----- */
.crash { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.7); display: grid; place-items: center; padding: 16px; }
.crash-in { background: var(--bg); border: 1px solid var(--line); border-radius: 18px; padding: 20px; max-width: 380px; width: 100%; text-align: center; }
.crash-in h2 { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; letter-spacing: .03em; font-size: 24px; margin: 6px 0; }
.crash-in pre { text-align: left; white-space: pre-wrap; }
.top .brand span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
img.av.px { image-rendering: pixelated; image-rendering: crisp-edges; }

/* ----- photo to pixel character ----- */
.px-panel { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px 4px; margin: 4px 0 10px; }
.px-prev { display: flex; gap: 12px; align-items: center; margin: 2px 0 8px; }
.px-prev img { width: 96px; height: 96px; border-radius: 12px; image-rendering: pixelated; flex: none; box-shadow: 0 0 0 2px var(--line); }

/* ----- game layer: rank, goals, backstage, trophies, live show ----- */
.rank { display: flex; gap: 10px; align-items: center; }
.rank-ic { font-size: 28px; line-height: 1; }
.rank-n { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .03em; font-size: 16px; }
.rank .bar { height: 6px; margin: 4px 0 2px; }
.goals { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 7px 10px; margin: 0 0 10px; }
.g-rank { display: flex; gap: 6px; align-items: center; width: 100%; border: 0; background: none; padding: 0; color: inherit; font: inherit; text-align: left; }
.g-rank b { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; letter-spacing: .03em; font-size: 14px; white-space: nowrap; }
.g-rank .bar { flex: 1; height: 5px; min-width: 30px; }
.goal-l { margin-top: 5px; display: grid; gap: 2px; }
.goal { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.goals .goal { font-size: 12px; }
.goal b { color: var(--accent-t); font-size: 12px; white-space: nowrap; }
.goals .link { margin-top: 6px; }
.bs { border-radius: 14px; padding: 12px; margin: 0 0 10px; border: 1px solid color-mix(in srgb, var(--accent) 55%, var(--line)); background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, var(--bg2)), var(--bg2)); animation: bsIn .5s cubic-bezier(.2,1.4,.4,1); }
@keyframes bsIn { from { transform: scale(.94); opacity: 0; } }
.bs-k { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--accent-t); }
.bs-t { font-family: var(--f-display); font-size: 20px; text-transform: uppercase; letter-spacing: .02em; margin: 2px 0 4px; }
.bs-d { font-size: 14px; margin-bottom: 10px; }
.bs-c { display: grid; gap: 6px; }
.bs-c .btn { display: flex; flex-direction: column; align-items: flex-start; text-align: left; gap: 1px; height: auto; padding: 8px 12px; }
.bs-c .btn span { font-size: 12px; font-weight: 500; opacity: .8; text-transform: none; letter-spacing: 0; font-family: var(--f-body, inherit); }
.tro-g { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 12px; }
.tro { border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px; font-size: 12px; opacity: .55; }
.tro.on { opacity: 1; border-color: color-mix(in srgb, var(--accent) 60%, var(--line)); background: color-mix(in srgb, var(--accent) 8%, transparent); }
.tro-i { font-size: 26px; }
.tro b { font-size: 13px; }
.lvl { font-family: var(--f-display); font-size: 12px; letter-spacing: .04em; padding: 2px 7px; border-radius: 999px; background: linear-gradient(180deg, #ffe99a, #f2c443 55%, #d19a1c); color: #2a1c00; white-space: nowrap; }
.flair { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 999px; background: linear-gradient(180deg, #ffe99a, #f2c443 55%, #d19a1c); color: #2a1c00; margin: 2px 0; white-space: nowrap; width: fit-content; }
.cv-by .flair { display: block; }
.belt-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin-top: 4px; }
.bp { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); font-size: 11px; font-weight: 700; text-align: center; }
.bp svg { width: 100%; height: auto; max-height: 46px; }
.sym-xs { width: 26px; height: auto; vertical-align: -3px; margin-right: 4px; }
.sym-big { text-align: center; margin: -2px 0 8px; } .sym-big svg { width: 160px; max-width: 60%; height: auto; }
.bp.on { border-color: var(--gold); box-shadow: 0 0 0 2px color-mix(in srgb, var(--gold) 45%, transparent); }
.bp.lock, .chip.lock { opacity: .5; } .bp.lock svg { filter: grayscale(1); }
.chip.on { border-color: var(--gold); color: var(--ink); background: color-mix(in srgb, var(--gold) 18%, transparent); }
.belt-spin { animation: beltspin 6s linear infinite; }
@keyframes beltspin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .belt-spin { animation: none; } }
.lv-co { margin-top: 10px; font-family: var(--f-display); font-size: 20px; letter-spacing: .05em; color: #9fd8ff; }
.lv-co span { display: block; font-family: inherit; font-size: 13px; color: #fff; letter-spacing: .02em; }
.mile { display: flex; gap: 10px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.mile.dim { opacity: .6; }
.mile-i { font-size: 22px; width: 28px; text-align: center; flex: none; }
.mile .bar { height: 5px; margin: 6px 0 3px; }
.tiers { display: flex; gap: 4px; flex: none; }
.tiers i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); }
.tiers i.on.t0 { background: #c98a4b; border-color: #c98a4b; } .tiers i.on.t1 { background: #c9d1d9; border-color: #c9d1d9; } .tiers i.on.t2 { background: #f2c443; border-color: #f2c443; }
.live { position: fixed; inset: 0; z-index: 58; display: flex; flex-direction: column; color: #fff; background: radial-gradient(ellipse at 50% -10%, rgba(255,255,255,.16), transparent 55%), linear-gradient(#0b0a12, #15121f); --muted-c: rgba(255,255,255,.65); }
.live.big { background: radial-gradient(ellipse at 50% -10%, rgba(255,190,80,.28), transparent 60%), linear-gradient(#0d0a06, #1c1408); }
.live .muted { color: var(--muted-c); }
.lv-h { padding-left: max(16px, calc(50% - 320px)) !important; padding-right: max(16px, calc(50% - 320px)) !important; display: flex; gap: 10px; align-items: center; padding: calc(env(safe-area-inset-top) + 12px) 16px 10px; border-bottom: 1px solid rgba(255,255,255,.12); }
.lv-dot { color: #ff5a5f; font-weight: 800; font-size: 12px; letter-spacing: .08em; animation: blink 1.2s infinite; }
@keyframes blink { 50% { opacity: .35; } }
.lv-name { font-family: var(--f-display); font-size: 22px; text-transform: uppercase; letter-spacing: .03em; line-height: 1.05; }
.lv-body { flex: 1; overflow-y: auto; padding: 14px max(16px, calc(50% - 320px)) calc(env(safe-area-inset-bottom) + 24px); }
.lv-seg, .lv-o, .lv-fin, .lv-me { opacity: 0; animation: lvIn .55s cubic-bezier(.2,1.3,.4,1) forwards; animation-delay: var(--d); }
@keyframes lvIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
.lv-seg { position: relative; overflow: hidden; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.lv-seg.main { border-color: rgba(255,190,80,.7); background: linear-gradient(135deg, rgba(255,190,80,.16), rgba(255,255,255,.05)); }
.lv-me { text-align: center; font-family: var(--f-display); letter-spacing: .12em; color: #ffcf5a; font-size: 18px; margin: 16px 0 8px; }
.lv-k { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: rgba(255,255,255,.6); font-weight: 700; }
.lv-w { font-weight: 800; font-size: 16px; margin: 4px 0 2px; }
.lv-w .vs { color: #ffb547; font-family: var(--f-display); margin: 0 6px; }
.lv-o { margin-top: 6px; }
.lv-txt { font-size: 14px; color: rgba(255,255,255,.85); margin-bottom: 4px; }
.lv-st { font-size: 20px; color: #ffcf5a; animation: starPop .5s cubic-bezier(.2,1.8,.4,1) both; animation-delay: var(--d); }
@keyframes starPop { from { transform: scale(.3); opacity: 0; } }
.lv-r { font-weight: 800; font-size: 13px; color: rgba(255,255,255,.7); }
.lv-crowd { font-size: 13px; font-weight: 700; color: #9fd0ff; margin-top: 4px; }
.lv-champ { margin-top: 8px; text-align: center; font-family: var(--f-display); font-size: 22px; letter-spacing: .06em; color: #1a1306; background: linear-gradient(90deg, #c9952b, #ffe08a, #c9952b); background-size: 200%; border-radius: 10px; padding: 6px; animation: shine 1.6s linear infinite; }
@keyframes shine { to { background-position: 200% 0; } }
.lv-hurt { margin-top: 6px; font-size: 13px; color: #ff8a92; font-weight: 700; }
.lv-conf { position: absolute; inset: 0; pointer-events: none; }
.lv-conf i { position: absolute; top: -10px; width: 7px; height: 11px; background: var(--c); border-radius: 2px; opacity: 0; animation: conf 1.6s ease-in forwards; }
@keyframes conf { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(calc(var(--x) * 40px), 160px) rotate(540deg); } }
.lv-fin { text-align: center; padding: 18px 4px 6px; }
.lv-score { font-family: var(--f-display); font-size: 84px; line-height: 1; color: #ffcf5a; text-shadow: 0 6px 30px rgba(255,190,80,.35); }
.lv-xp { margin-top: 10px; font-weight: 800; color: #ffb547; }
.lv-goals { text-align: left; display: grid; gap: 6px; margin: 12px 0 0; background: rgba(255,255,255,.06); border-radius: 12px; padding: 10px 12px; }
.lv-goals .goal b { color: #ffcf5a; }
.lv-goals .goal.no { opacity: .7; }
.lv-rank { margin-top: 12px; font-family: var(--f-display); font-size: 26px; letter-spacing: .05em; color: #ffcf5a; animation: bellpop .6s cubic-bezier(.2,1.6,.4,1) both; animation-delay: var(--d); }
.lv-rank span { display: block; font-family: inherit; font-size: 14px; color: #fff; letter-spacing: .02em; }
.lv-tro { margin-top: 12px; display: grid; gap: 4px; }
.lv-tease { margin-top: 12px; color: #ffb547; font-weight: 700; }
.live .btn { color: inherit; }
.live .btn:not(.pri) { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.18); }
.live.skip .lv-seg, .live.skip .lv-o, .live.skip .lv-fin, .live.skip .lv-me, .live.skip .lv-st, .live.skip .lv-rank { animation-delay: 0s !important; animation-duration: .01s !important; }
.live.skip .lv-conf { display: none; }

/* ----- records ----- */
.form { display: inline-flex; gap: 3px; }
.form i { font-style: normal; font-size: 11px; font-weight: 800; width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; color: #fff; }
.form .f-W { background: var(--good); } .form .f-L { background: var(--bad); } .form .f-D { background: #8a8a99; }
.cstats > div { text-align: center; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 2px; }
.cstats b { display: block; font-size: 17px; } .cstats span { font-size: 11px; color: var(--dim); }
.cstats { gap: 6px; }
.contend { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; margin-top: 3px; }
.lv-streak { margin-top: 6px; font-weight: 800; color: #ffb547; font-size: 14px; }

/* ----- road to the PPV ----- */
.road { border-radius: 14px; padding: 10px 12px; margin: 0 0 10px; border: 1px solid color-mix(in srgb, var(--gold, #d4a72c) 55%, var(--line)); background: linear-gradient(135deg, color-mix(in srgb, var(--gold, #d4a72c) 14%, var(--bg2)), var(--bg2)); }
.road-h { display: flex; gap: 8px; align-items: baseline; }
.road-k { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
.road-h b { font-family: var(--f-display); font-weight: 400; text-transform: uppercase; letter-spacing: .03em; font-size: 18px; }
.road-w { font-size: 12px; font-weight: 800; color: var(--accent-t); white-space: nowrap; }
.road-l { display: grid; gap: 8px; margin: 8px 0 6px; }
.road-n { font-size: 13px; font-weight: 700; }
.road-n .vs { color: var(--accent-t); font-family: var(--f-display); margin: 0 5px; }
.road-b { display: flex; gap: 8px; align-items: center; margin-top: 3px; }
.road-b .bar { flex: 1; height: 7px; }
.road-b .bar i { background: linear-gradient(90deg, #ff8a3d, #ffcf5a); }
.road-b b { font-size: 12px; min-width: 22px; text-align: right; }
.road-b .btn { padding: 4px 8px; min-height: 0; font-size: 11px; }
.road > .btn { margin-top: 6px; }
.hype { color: #ff9a3d; font-weight: 700; }

/* ----- line icons ----- */
svg.i { width: 1.05em; height: 1.05em; vertical-align: -0.16em; fill: var(--ic, currentColor); stroke: none; flex: none; }
/* icons are gold by default; on colored buttons, tags and status text they follow the text color */
body { --ic: var(--gold); }
.btn.pri, .btn.bad, .tag, .n-face, .pick.sel .ck, .why .p, .kpi-alert, .kpi-ok, .cal-c, .cal-t.sel, .warnline, .need.met, .top-logo,
.filters button.on, .seg-ctl button.on, .mrow.me .mpos, .mchips .hint, .mv.up, .br-m .won, .hs-cont, .cv-like.on,
[style*="color:var(--"], [style*="color: var(--"] { --ic: currentColor; }
.tabs svg.i, nav svg.i { width: 22px; height: 22px; }

/* ----- Shows screen hierarchy: card first ----- */
.cal { padding: 6px; }
.cal-h { margin-bottom: 4px; }
.cal-h b { font-size: 15px !important; }
.cal-t { padding: 4px 2px; gap: 0; }
.cal-n { font-size: 17px !important; }
.cal-t .cal-e { display: none; }
.cal-t.sel { box-shadow: none; }
.tools { display: flex; justify-content: center; gap: 22px; margin: 8px 0 2px; }
.tools .link, .link.center { font-size: 13px; color: var(--dim); }
.link.center { display: block; margin: 8px auto 0; }
.later { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); }
.later:empty { display: none; }
.goals .goal b { color: var(--dim); }

/* ----- import: confirm step ----- */
.rt-found { display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: color-mix(in srgb, var(--good) 12%, var(--card)); border: 1px solid color-mix(in srgb, var(--good) 40%, var(--line)); }
.rt-found b { font-size: 16px; }
.rt-list summary { cursor: pointer; list-style: none; color: var(--dim); }
.rt-list summary::-webkit-details-marker { display: none; }
.mf .btn[disabled] { opacity: .5; }

/* ----- rankings, history, teams, tournaments ----- */
.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.rk { align-items: center; }
.rk-n { width: 26px; text-align: center; font-weight: 800; font-size: 17px; color: var(--dim); flex: none; }
.rk.champ { border: 1px solid color-mix(in srgb, var(--accent) 50%, var(--line)); margin-bottom: 8px; }
.rk.champ .rk-n { color: var(--accent-t); }
.mv { font-size: 11px; font-weight: 700; color: var(--dim); margin-left: 4px; }
.mv.up { color: var(--good); } .mv.dn { color: var(--bad); } .mv.new { color: var(--info); }
.rec-t { display: flex; align-items: center; gap: 8px; margin: 16px 0 4px; }
.aw { margin-bottom: 10px; }
.aw-r { display: flex; flex-direction: column; padding: 6px 0; border-top: 1px solid var(--line); }
.aw-r:first-of-type { border-top: 0; }
.aw-r b { font-size: 15px; }
.bracket { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.br-r { display: flex; flex-direction: column; justify-content: space-around; gap: 8px; min-width: 132px; }
.br-h { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); }
.br-m { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
.br-m div { padding: 6px 8px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.br-m div + div { border-top: 1px solid var(--line); }
.br-m .won { font-weight: 800; color: var(--good); }
.br-m .out { color: var(--dim); text-decoration: line-through; }
.tcard { margin-bottom: 10px; }
.lv-more { display: flex; justify-content: center; gap: 18px; margin-top: 10px; }
.lv-aw { margin-top: 12px; }

/* ----- plan the PPV first ----- */
.ppv-first { border-radius: 14px; padding: 12px 14px; margin: 0 0 12px; border: 1px solid color-mix(in srgb, var(--gold, #d4a72c) 65%, var(--line)); background: linear-gradient(135deg, color-mix(in srgb, var(--gold, #d4a72c) 20%, var(--bg2)), var(--bg2)); }
.ppv-k { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-t); }
.ppv-t { font-size: 18px; margin: 4px 0; }
.ppv-note { font-size: 13px; padding: 10px 12px; margin: 0 0 12px; border-radius: 12px; border: 1px dashed color-mix(in srgb, var(--gold, #d4a72c) 55%, var(--line)); }
.road-hot { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 8px; border-radius: 10px; background: color-mix(in srgb, var(--bad) 10%, transparent); }

/* ----- home screen ----- */
.home .hero { padding: 26px 6px 6px; }
.home .hero svg { max-width: 96px; height: auto; }
.home .hero h1 { font-size: 40px !important; line-height: .95 !important; margin: 6px 0 4px !important; }
.home .hero p { margin: 4px 0 0; }
.hs-cont { display: grid; grid-template-columns: 1fr auto; text-align: left; width: 100%; padding: 14px 16px; border-radius: 16px; border: 0; cursor: pointer; background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 70%, #000)); color: var(--accent-ink); margin-top: 8px; }
.hs-cont .hs-k { grid-column: 1; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.hs-cont .hs-ct { grid-column: 1; font-size: 20px; font-weight: 800; }
.hs-cont .hs-cd { grid-column: 1; font-size: 13px; opacity: .85; }
.hs-cont .hs-arrow { grid-column: 2; grid-row: 1 / 4; align-self: center; font-size: 30px; font-weight: 300; }
.hs-sec { display: flex; align-items: flex-end; gap: 10px; margin: 22px 0 10px; }
.hs-sec > div { flex: 1; }
.hs-sec b { font-size: 17px; }
.hs-shelf { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px; padding: 2px 16px 8px; scrollbar-width: none; }
.hs-shelf::-webkit-scrollbar { display: none; }
.hs-card { flex: 0 0 78%; max-width: 320px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: inherit; cursor: pointer; font: inherit; }
.hs-card.feat { border-color: color-mix(in srgb, var(--gold, #d4a72c) 60%, var(--line)); background: linear-gradient(160deg, color-mix(in srgb, var(--gold, #d4a72c) 16%, var(--card)), var(--card)); }
.hs-by { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent-t); }
.hs-t { font-size: 17px; font-weight: 800; line-height: 1.2; }
.hs-d { font-size: 13px; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hs-m { font-size: 12px; font-weight: 600; margin-top: 2px; }
.hs-s { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hs-go { margin-top: auto; padding-top: 8px; font-weight: 800; color: var(--accent-t); }
.hs-card.skel { min-height: 150px; cursor: default; }
.hs-card.skel span { display: block; height: 12px; border-radius: 6px; background: var(--card2); margin-bottom: 8px; animation: hsPulse 1.2s ease-in-out infinite alternate; }
.hs-card.skel span:nth-child(2) { width: 70%; } .hs-card.skel span:nth-child(3) { width: 45%; }
@keyframes hsPulse { from { opacity: .45; } to { opacity: 1; } }
.hs-off { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; border: 1px dashed var(--line); }
.hs-off .small { flex: 1; }
.sup-go { text-decoration: none; display: flex; justify-content: center; align-items: center; gap: 6px; }
.hs-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.hs-opt { display: flex; flex-direction: column; gap: 4px; text-align: left; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: inherit; cursor: pointer; font: inherit; }
.hs-opt b { font-size: 15px; }
.hs-ic { color: var(--accent-t); font-size: 20px; }

/* ----- community accounts ----- */
.cv-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.cv-by { flex: 1; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 0; color: inherit; font: inherit; text-align: left; cursor: pointer; min-width: 0; }
.cv-by > span:nth-child(2) { display: flex; flex-direction: column; min-width: 0; }
.cv-like.on { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, var(--line)); }
.prof .cstats { margin-top: 8px; }
.seg-ctl.sm button { padding: 6px 8px; font-size: 13px; }
/* ----- never let text spill out of its box ----- */
.seg-ctl button, .filters button, .btn, .chip, .pill, .tag { min-width: 0; max-width: 100%; white-space: normal; overflow-wrap: anywhere; line-height: 1.15; }
.seg-ctl button { overflow-wrap: normal; word-break: normal; }
.bk-bar { margin: 0 0 10px; align-items: center; flex-wrap: wrap; gap: 8px; }
.bk-bar .sp { flex: 1 1 160px; }
/* ----- accessibility: less motion, visible focus ----- */
html[data-motion="reduce"] *, html[data-motion="reduce"] *::before, html[data-motion="reduce"] *::after { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; scroll-behavior: auto !important; }
@media (prefers-reduced-motion: reduce) { html:not([data-motion="full"]) *, html:not([data-motion="full"]) *::before, html:not([data-motion="full"]) *::after { animation-duration: .01s !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01s !important; } }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.modal:focus, .live:focus, main:focus, .mb:focus:not(:focus-visible) { outline: none; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
@media (max-width: 380px) { .seg-ctl button { font-size: 12.5px; letter-spacing: .01em; padding: 8px 3px; } .seg-ctl { gap: 2px; } }
/* the same squeeze when big text makes the screen effectively narrow */
html[data-nw] .seg-ctl button { font-size: 12.5px; letter-spacing: .01em; padding: 8px 3px; } html[data-nw] .seg-ctl { gap: 2px; }
html[data-nw="2"] .cal-now { font-size: 8.5px; letter-spacing: 0; } html[data-nw="2"] .stat { padding: 8px 8px; } html[data-nw="2"] .stat .v { font-size: 18px; } html[data-nw="2"] .seg-ctl button { font-size: 11.5px; letter-spacing: 0; padding: 7px 2px; } html[data-nw="2"] .cal-t { font-size: 10px; letter-spacing: 0; }
@media (max-width: 300px) { .cal-now { font-size: 8.5px; letter-spacing: 0; } .stat { padding: 8px 8px; } .stat .v { font-size: 18px; } .seg-ctl button { font-size: 11.5px; letter-spacing: 0; padding: 7px 2px; } .cal-t { font-size: 10px; letter-spacing: 0; } }
.seg-ctl .cnt, .filters .cnt { display: inline-block; min-width: 1.6em; padding: 0 .35em; border-radius: 99px; background: color-mix(in srgb, currentColor 10%, transparent); font-size: .85em; line-height: 1.4; letter-spacing: 0; }
.item .main, .row > *, .sp { min-width: 0; }
.t, .d, .small, .tiny, h1, h2, h3, p, li, label, td, th, b, .news { overflow-wrap: anywhere; }
img, svg, video, canvas, input, select, textarea { max-width: 100%; }
/* ---- several companies ---- */
.co-bar { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; }
.co-chips { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; }
.co-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px 4px 4px; border-radius: 999px; border: 1px solid var(--line, rgba(127,127,127,.3)); background: var(--card); color: var(--ink); font: inherit; font-size: 13px; cursor: pointer; flex: none; }
.co-chip.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; cursor: default; }
.wk-chip { flex: none; padding-right: 10px; }
.wk-chip .co-dot { font-size: 10px; }
.wk-n { max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 650; line-height: 1.1; text-align: left; }
.wk-n small { display: block; font-size: 10px; font-weight: 500; opacity: .7; }
.wk-chip.up:not(.on) { border-color: var(--accent); }
.wk-chip.up .co-st { color: var(--accent-t); font-weight: 700; font-size: 11px; }
.wk-strip { margin: 0 0 10px; }
.wk-h { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.wk-strip .co-chips { position: relative; padding-bottom: 2px; scrollbar-width: none; }
.co-dot { display: inline-grid; place-items: center; min-width: 30px; height: 24px; padding: 0 5px; border-radius: 999px; color: #fff; font-weight: 800; font-size: 11px; }
.co-st { font-weight: 800; }
.co-wait { flex-wrap: wrap; gap: 8px; }
.co-wait .sp { flex: 1 1 180px; }
/* ---- Book It logo and splash ---- */
.home .hero h1 em, .wz .hero h1 em { display: inline; font-size: inherit; }
.logo-art { width: min(250px, 70vw); height: auto; display: block; margin: 0 auto 4px; filter: drop-shadow(0 14px 26px rgba(0,0,0,.45)); overflow: visible; }
.logo-art.sm { width: min(170px, 50vw); }
.hero-sub { font-family: var(--f-display, Impact, sans-serif); text-transform: uppercase; letter-spacing: .18em; font-size: 14px; color: var(--dim); margin: 6px 0 4px; }
#splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: radial-gradient(circle at 50% 42%, #2a2140, #0c0a12 70%); color: #fff; cursor: pointer; animation: spOut .45s ease 2.35s forwards; }
#splash .sp-in { text-align: center; padding: 16px; animation: spShake .3s linear 1.15s; }
#splash .logo-art { width: min(300px, 74vw); filter: drop-shadow(0 20px 40px rgba(0,0,0,.6)); }
#splash .bl-ham { transform-box: fill-box; transform-origin: 50% 100%; animation: spStrike .29s ease-in .26s 3 both; }
#splash .bl-bell { transform-box: fill-box; transform-origin: 50% 50%; animation: spRing .29s ease-out .55s 3; }
#splash .bl-ding { transform-box: fill-box; transform-origin: 50% 50%; animation: spDing 1.45s linear both; }
#splash .sp-t { font-family: var(--f-display, Impact, sans-serif); font-size: clamp(46px, 15vw, 72px); line-height: 1; text-transform: uppercase; letter-spacing: .03em; margin-top: 4px; animation: spSlam .36s cubic-bezier(.3,1.5,.5,1) 1.2s both; }
#splash .sp-t b { font-weight: 400; color: transparent; background: linear-gradient(180deg, #fff3c2, #f6c544 50%, #c78a12); -webkit-background-clip: text; background-clip: text; }
#splash .sp-s { font-family: var(--f-display, Impact, sans-serif); text-transform: uppercase; letter-spacing: .22em; font-size: 15px; color: #c9c0dc; margin-top: 8px; animation: spFade .4s ease 1.55s both; }
#splash.still, #splash.still * { animation-duration: 0s !important; animation-delay: 0s !important; }
#splash.still { animation: spOut .3s ease .8s forwards !important; }
@keyframes spStrike { 0% { transform: rotate(0); } 45% { transform: rotate(34deg); } 100% { transform: rotate(0); } }
@keyframes spRing { 0% { transform: translate(3px, 0) rotate(3deg); } 25% { transform: translate(-3px, 0) rotate(-2deg); } 55% { transform: translate(1px, 0) rotate(1deg); } 100% { transform: none; } }
@keyframes spDing { 0%, 37% { opacity: 0; transform: scale(.8); } 38% { opacity: 1; transform: scale(.85); } 56% { opacity: 0; transform: scale(1.2); } 58% { opacity: 1; transform: scale(.85); } 76% { opacity: 0; transform: scale(1.2); } 78% { opacity: 1; transform: scale(.85); } 100% { opacity: 1; transform: scale(1); } }
@keyframes spShake { 20% { transform: translate(-6px, 3px); } 40% { transform: translate(5px, -3px); } 60% { transform: translate(-4px, 2px); } 80% { transform: translate(3px, -1px); } }
@keyframes spSlam { from { transform: scale(2.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes spFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes spOut { to { opacity: 0; visibility: hidden; } }

/* polish pass: readable form chips and bigger tap areas on small controls (the look stays the same) */
.form .f-W, .form .f-L { color: #14110c; }
.link, .chip button, .kpi-alert, .sw, .g-rank { position: relative; }
.link::before, .chip button::before, .kpi-alert::before, .sw::before { content: ""; position: absolute; inset: -8px -4px; }
.chip button::before, .sw::before { inset: -8px; }
.filters button, .chip.add, .seg-ctl.sm button { min-height: 36px; }
.todo input[type=checkbox] { width: 24px; height: 24px; margin: 0; }
.g-rank { min-height: 36px; }
</style>
</head>

const GM_RISK = [{ fat: 4, inj: .005, l: 'Low' }, { fat: 10, inj: .02, l: 'Medium' }, { fat: 16, inj: .04, l: 'High' }];

const gmNames = () => [...Object.keys(STIPS), ...CM().gims.map(x => x.name)];
const sideSize = (mt, i) => mt.ffa ? 1 : mt.sizes ? mt.sizes[i] || 1 : mt.size;
const tagMT = mt => !mt.ffa && !mt.sizes && mt.sides === 2 && mt.size === 2;

const entrants = s => s.sides.flat();
const FINISHES = {
  'Clean': { r: 0, heat: 0, win: [8, 1.2], lose: [-6, -0.6], desc: 'A clean pin. The winner gets the biggest boost.' },
  'Submission': { r: 1, heat: 1, win: [8, 1.2], lose: [-5, -0.5], desc: 'The loser taps out. Best for technicians.' },
  'Roll-up': { r: -1, heat: 3, win: [5, 0.7], lose: [-1, 0], desc: 'A quick surprise pin. The loser still looks strong.' },

function news(text, cat) { G.news.unshift({ wk: G.week, text, cat: cat || 'misc' }); if (G.news.length > 400) G.news.length = 400; }
function nm(id) { const w = W(id); if (!w) return 'Unknown'; return `<span class="n-${w.align}">${esc(w.name)}</span>`; }

// ---------- simulation ----------
function chem(a, b) {
  const k1 = a.style + '|' + b.style, k2 = b.style + '|' + a.style;
  let c = STYLE_CHEM[k1] ?? STYLE_CHEM[k2] ?? 0;
  // a hidden, stable personal chemistry for each pair
  let h = 0; for (const ch of [a.id, b.id].sort().join('')) h = (h * 33 + ch.charCodeAt(0)) >>> 0;
  return c + ((h % 9) - 3);
}
function storyBetween(groupA, groupB) {
  return G.stories.find(s => s.status === 'active' && (
    (s.a.some(x => groupA.includes(x)) && s.b.some(x => groupB.includes(x))) ||
    (s.b.some(x => groupA.includes(x)) && s.a.some(x => groupB.includes(x)))));
}
// the hottest story with people from both sides inside one big free-for-all
const storyAmong = ids => G.stories.filter(s => s.status === 'active' && s.a.some(x => ids.includes(x)) && s.b.some(x => ids.includes(x))).sort((a, b) => b.heat - a.heat)[0];
// ---------- storylines that grow out of the booking ----------
// After each show, look for a moment the crowd would latch onto and start (at most) one story from it.
function organicStories(results, before) {
  if (G.settings.organic === false) return;
  if (G.stories.filter(s => s.status === 'active').length >= 6) return;
  const ok = ids => ids.length && ids.every(id => { const w = W(id); return w && (w.contract || !CON()) && !w.injury && storiesTouching([id]).length < 2; });
  const free = (a, b) => ok(a) && ok(b) && !storyBetween(a, b) && !a.some(x => b.includes(x));
  const ln = ids => ids.map(id => lastName(W(id))).join(' & ');
  const ideas = [];
  for (const r of results) {
    const sg = r.seg, sides = sg.kind === 'match' ? sg.sides.filter(sd => sd.length) : [sg.who || [], sg.target || []].filter(sd => sd.length);
    if (sides.length !== 2) continue;
    const win = r.winners || [], wi = sides.findIndex(sd => sd.some(id => win.includes(id))), lose = wi >= 0 ? sides[1 - wi] : null;
    // 1. a title changed hands: the old champion wants it back
    const t = sg.kind === 'match' && sg.title && G.titles.find(x => x.id === sg.title);
    if (t && wi >= 0 && (r.notes || []).some(n => /NEW CHAMPION/i.test(n))) {
      const old = (before[t.id] || []).filter(id => lose.includes(id));
      if (old.length) ideas.push({ p: 5, a: old, b: t.holder.slice(), type: 'Title Chase', titleId: t.id, heat: 35, title: `${ln(old)} want${old.length > 1 ? '' : 's'} the ${t.short} back`, why: `${ln(old)} lost the ${t.name} and want${old.length > 1 ? '' : 's'} a rematch.` });
    }
    // 2. a long win streak got snapped: revenge
    if (lose && (r.notes || []).some(n => /snapped/i.test(n))) ideas.push({ p: 4, a: lose, b: sides[wi], heat: 30, title: `${ln(lose)} want${lose.length > 1 ? '' : 's'} revenge`, why: `${ln(sides[wi])} ended ${ln(lose)}'s win streak.` });
    // 3. a sneak attack on someone they teamed with recently: betrayal
    if (sg.kind === 'angle') {
      const [a, b] = sides, teamed = G.history.slice(-5).some(h => h.results.some(x => x.seg.kind === 'match' && x.seg.sides.some(sd => a.some(id => sd.includes(id)) && b.some(id => sd.includes(id)))));
      if (teamed) ideas.push({ p: 5, a: b, b: a, heat: 40, title: `Betrayal: ${ln(a)} turns on ${ln(b)}`, why: `${ln(a)} attacked their own tag partner ${ln(b)}.` });
    }
    // 4. a draw or a great match leaves unfinished business
    if (sg.kind === 'match' && sides.length === 2 && sides.every(sd => sd.length === 1) && (wi < 0 && sg.winner === -2 || r.rating >= 82)) ideas.push({ p: 2, a: sides[0], b: sides[1], heat: 25, title: `${ln(sides[0])} vs ${ln(sides[1])}: Unfinished business`, why: wi < 0 ? 'Their match ended in a draw. Nobody is satisfied.' : `Their ${r.rating}-rated match left fans wanting more.` });
  }
  // 5. the same two keep crossing paths: three times in the last four shows becomes a feud
  const pairOf = sg => { const sd = sg.kind === 'match' ? sg.sides.filter(x => x.length) : [sg.who || [], sg.target || []]; return sd.length === 2 && sd[0].length === 1 && sd[1].length === 1 ? [sd[0][0], sd[1][0]].sort().join('|') : null; };
  const counts = {};
  for (const h of G.history.slice(-4)) for (const k of new Set(h.results.map(x => pairOf(x.seg)).filter(Boolean))) counts[k] = (counts[k] || 0) + 1;
  for (const [k, n] of Object.entries(counts)) if (n >= 3) { const [a, b] = k.split('|'); if (results.some(r => pairOf(r.seg) === k)) ideas.push({ p: 3, a: [a], b: [b], heat: 20 + n * 4, why: `They keep crossing paths: ${n} times in the last 4 shows.` }); }
  const pick = ideas.filter(x => free(x.a, x.b)).sort((x, y) => y.p - x.p)[0];
  if (!pick) return;
  const title = (pick.title || `${ln(pick.a)} vs ${ln(pick.b)}`).slice(0, 60);
  G.stories.push({ id: uid(), title, type: pick.type || 'Feud', a: pick.a.slice(), b: pick.b.slice(), titleId: pick.titleId || null, heat: pick.heat, start: G.week, status: 'active', notes: pick.why, log: [{ wk: G.week, text: 'Started on its own: ' + pick.why }], autoEnd: true, organic: true });
  news(`🔥 A story is building: "${title}". ${pick.why}`, 'story');
  const r = results.find(x => segPeople(x.seg).some(id => pick.a.includes(id)) && segPeople(x.seg).some(id => pick.b.includes(id)));
  if (r) (r.notes ||= []).push(`🔥 New storyline: ${title}`);
}
function storiesTouching(ids) { return G.stories.filter(s => s.status === 'active' && [...s.a, ...s.b].some(x => ids.includes(x))); }
function recentlyFaced(ids) {
  // same opponents booked in the last 2 weeks
  const key = ids.slice().sort().join(',');
  return G.history.slice(-2).some(h => (h.keys || []).includes(key));

// ---------- road to the PPV: announce the big card early, build hype on weekly shows ----------
const ppvCard = wk => {
  if (onMain()) return wk === G.week ? G.card : (G.future[wk] || []);
  const m = SHOWS()[0], f = (m.future || {})[wk];
  return f || (wk === (m.wk ?? G.week) ? m.card || [] : []);
};
const ppvMatches = wk => ppvCard(wk).filter(x => x.kind === 'match' && x.sides.filter(sd => sd.length).length >= 2);
const hypeOf = m => Math.round(m.hype || 0);
// how much a weekly segment builds an announced PPV match: both sides together builds the most
function buildsFor(seg, m) {
  const ppl = new Set(segPeople(seg)), sides = m.sides.filter(sd => sd.length);
  const hit = sides.filter(sd => sd.some(id => ppl.has(id))).length;
  if (isFFA(m)) return hit ? 1 : 0;
  return hit >= 2 ? 2 : hit === 1 ? 1 : 0;
}
function buildHype(results, wk) {
  const big = nextBig(); if (!big || big === wk) return;
  const ms = ppvMatches(big); if (!ms.length) return;
  for (const m of ms) {
    let gain = 0;
    for (const r of results) { const b = buildsFor(r.seg, m); if (b === 2) gain += 6 + r.rating / 9; else if (b === 1) gain += 1.5 + r.rating / 40; }
    if (!gain) { m.hype = Math.max(0, (m.hype || 0) - 4); continue; }
    m.hype = clamp((m.hype || 0) + gain, 0, 100);
    const label = vsLine(m, sd => sd.map(id => nameOf(id).split(' ').pop()).join(' & '));
    for (const r of results) if (buildsFor(r.seg, m)) { (r.notes ||= []).push(`📈 ${bigName(big)}: ${label} hype +${Math.round(gain)}`); break; }
  }
}
// the PPV comes first: plan its card, then use the weekly shows to build to it
function ppvFirst() {
  const big = nextBig(); if (!big || big === G.week || ppvMatches(big).length) return '';
  const left = big - G.week, name = bigName(big);
  return `<div class="ppv-first"><div class="ppv-k">Step 1 · Plan the big event first</div>
    <div class="ppv-t">🎆 <b>${esc(name)}</b> is ${left === 1 ? 'next week' : 'in ' + left + ' weeks'}</div>

    <div class="tiny muted" style="margin-top:6px">You can change it later if a story heats up.</div></div>`;
}
// stories that have got hotter than the matches already announced
function hotForPPV(big) {

  const onCard = st => ms.some(m => st.a.some(x => m.sides.flat().includes(x)) && st.b.some(x => m.sides.flat().includes(x)));
  const low = Math.min(...ms.map(hypeOf));
  return G.stories.filter(st => st.status === 'active' && st.heat >= 45 && st.heat > low && !onCard(st) && [...st.a, ...st.b].every(id => W(id)?.contract)).sort((a, b) => b.heat - a.heat).slice(0, 2);

// ---------- records: streaks, recent form, career stats, contender rankings ----------
const STATS = w => w.stats ||= { m: 0, sum: 0, best: 0, tw: 0, def: 0, motn: 0 };
const formOf = w => w.form ||= [];
const winPct = w => { const r = w.record || {}; const n = (r.w || 0) + (r.l || 0) + (r.d || 0); return n ? (r.w + (r.d || 0) * .5) / n : .5; };
const recentWins = (w, n = 5) => formOf(w).slice(0, n).filter(x => x === 'W').length;
const recStr = w => `${w.record?.w || 0}–${w.record?.l || 0}${w.record?.d ? '–' + w.record.d : ''}`;
function streakTag(w) { const k = w.streak || 0; return k >= 3 ? `<span class="tag good">🔥 W${k}</span>` : k <= -4 ? `<span class="tag bad">🥶 L${-k}</span>` : ''; }
function formChips(w) { const f = formOf(w).slice(0, 5); return f.length ? `<span class="form">${f.map(x => `<i class="f-${x}">${x}</i>`).join('')}</span>` : '<span class="muted">no matches yet</span>'; }
// contenders: popularity, recent form, overall record and streak all count
const contenderScore = w => w.pop * 0.5 + recentWins(w, 10) * 3.5 + winPct(w) * 18 + Math.max(-6, Math.min(12, (w.streak || 0) * 2)) + (w.momentum || 0) * 0.2;
// a title's division: set by the booker, or guessed from its name and champion
function titleDiv(t) {
  if (t.division) return t.division;
  if (/wom[ae]n|ladies|female/i.test(t.name || '')) return "Women's";
  const h = W(t.holder[0]); if (h?.division && h.division !== 'Open') return h.division;
  if (G.titles.some(x => x !== t && /wom[ae]n/i.test(x.name || ''))) return "Men's";
  return 'Open';
}
const divOk = (t, w) => { const d = titleDiv(t); return d === 'Open' || !w.division || w.division === 'Open' || w.division === d; };
function contenders(t, n = 5) {
  const ok = w => w && w.contract && !t.holder.includes(w.id) && !w.injury && divOk(t, w);
  const picked = (t.contenders || []).map(W).filter(w => w && w.contract && !t.holder.includes(w.id) && !w.injury); // the booker's picks skip the division check
  // auto ranks: other singles champions and the top 3 of more prestigious titles go chase those instead
  const busy = new Set();
  for (const o of G.titles) {
    if (o.id === t.id || o.tag) continue;
    o.holder.forEach(id => busy.add(id));
    if ((o.prestige || 0) > (t.prestige || 0) && !t.tag) contenders(o, 3).forEach(w => busy.add(w.id));
  }
  const pool = signed().filter(w => ok(w) && !picked.includes(w) && (!splitOn() || !showById(t.brand) || brandOf(w) === t.brand)).sort((a, b) => contenderScore(b) - contenderScore(a));
  const rest = pool.filter(w => !busy.has(w.id)).concat(pool.filter(w => busy.has(w.id)));
  return picked.concat(rest).slice(0, n);
}

// ---------- title lineage: every reign, how long it lasted, how many defenses ----------
function ensureReigns(t) {
  if (!Array.isArray(t.reigns)) t.reigns = t.holder.length ? [{ rh: t.holder.slice(), nm: t.holder.map(nameOf).join(' & '), from: t.since || 1, to: 0, d: 0 }] : [];
  return t.reigns;
}
function crown(t, ids) {

  if (cur && !cur.to) { cur.to = Math.max(cur.from, G.week); cur.d = t.defenses || 0; }
  if (ids.length) rs.push({ rh: ids.slice(), nm: ids.map(nameOf).join(' & '), from: G.week, to: 0, d: 0 });
  if (rs.length > 80) rs.splice(0, rs.length - 80);
}
const reignLen = r => Math.max(1, (r.to || G.week) - r.from);
const reignDef = (t, r) => r.to ? (r.d || 0) : (t.defenses || 0);
function reignsOfW(id) { return G.titles.flatMap(t => ensureReigns(t).filter(r => r.rh.includes(id)).map(r => ({ t, r }))); }

// ---------- tag teams and stables ----------
const TM = id => (G.teams || []).find(t => t.id === id);
function teamOf(ids) { return ids.length >= 2 ? (G.teams || []).find(t => ids.every(id => t.members.includes(id))) : null; }
// factions: bigger groups (up to 8) that can hold whole tag teams; any 2+ of them on one side fight as the faction
const FC = id => (G.factions || []).find(f => f.id === id);
function factionOf(ids) { return ids.length >= 2 ? (G.factions || []).find(f => ids.every(id => f.members.includes(id))) : null; }
const factionsOfW = id => (G.factions || []).filter(f => f.members.includes(id));
// what a side is called: its team, then its faction, then its names
function sideLabel(ids) { const tm = teamOf(ids) || factionOf(ids); return tm ? tm.name : ids.map(nameOf).join(' & '); }
// "A vs B" for a normal match; a rumble or battle royal is just named for its size
const vsLine = (s, f = sd => sd.map(nameOf).join(' & ')) => isFFA(s) ? `the ${entrants(s).length}-person ${s.mtype}` : s.sides.map(f).join(' vs ');
const teamRec = t => `${t.w || 0}–${t.l || 0}${t.d ? '–' + t.d : ''}`;
const liveMembers = t => t.members.map(W).filter(w => w && w.contract);

// ---------- rankings ----------
function rankDivs() { return DIVISIONS.filter(d => signed().some(w => (w.division || 'Open') === d)); }
function divChamp(div) {
  const t = G.titles.filter(t => !t.tag && t.holder.length && titleDiv(t) === div).sort((a, b) => b.prestige - a.prestige)[0];
  return t && W(t.holder[0]) ? { w: W(t.holder[0]), t } : null;
}
function ranking(div, n = 10) {
  const c = divChamp(div);
  return signed().filter(w => (w.division || 'Open') === div && w.id !== c?.w.id).sort((a, b) => contenderScore(b) - contenderScore(a)).slice(0, n);
}
const teamScore = t => (t.w || 0) * 3 - (t.l || 0) + avg(liveMembers(t).map(w => w.pop)) / 8;
function rankedTeams() { return (G.teams || []).filter(t => liveMembers(t).length >= 2).sort((a, b) => teamScore(b) - teamScore(a)); }
function rankSnap() { const o = {}; for (const d of rankDivs()) ranking(d).forEach((w, i) => o[w.id] = i + 1); rankedTeams().slice(0, 10).forEach((t, i) => o[t.id] = i + 1); return o; }
function rankMove(id, now) {
  const was = G.rankPrev?.[id];
  if (!G.history.length) return '';
  if (was == null) return '<span class="mv new">NEW</span>';
  if (was > now) return `<span class="mv up">▲${was - now}</span>`;
  if (was < now) return `<span class="mv dn">▼${now - was}</span>`;
  return '<span class="mv">–</span>';

// ---------- tournaments: a bracket played over several shows ----------
const TN = id => (G.tourneys || []).find(t => t.id === id);
function bracketOrder(n) { let o = [0]; while (o.length < n) { const m = o.length * 2; o = o.flatMap(x => [x, m - 1 - x]); } return o; }
function roundName(T, r) { const n = T.rounds[r]?.length || 1; return n === 1 ? 'Final' : n === 2 ? 'Semifinal' : n === 4 ? 'Quarterfinal' : 'Round of ' + n * 2; }
function tPending(T) { if (T.done) return []; const r = T.rounds.length - 1; return T.rounds[r].map((x, i) => ({ x, r, i })).filter(o => !o.x.adv); }
function tOnCard(T, r, i) { return G.card.some(s => s.tid === T.id && s.tr === r && s.ti === i); }
function tAdvance(T) {
  const r = T.rounds[T.rounds.length - 1];
  if (r.some(x => !x.adv)) return;
  if (r.length === 1) return tFinish(T, r[0].adv);
  const next = []; for (let i = 0; i < r.length; i += 2) next.push({ pair: [r[i].adv, r[i + 1].adv], adv: null });
  T.rounds.push(next);
  news(`🏆 ${T.name}: the ${roundName(T, T.rounds.length - 1).toLowerCase()}${next.length > 1 ? 's are' : ' is'} set. ${next.map(x => x.pair.map(nameOf).join(' vs ')).join(', ')}.`, 'title');
}
function tFinish(T, wid) {
  T.done = G.week; T.won = wid; carBump('tourneys'); award('bracket');
  const w = W(wid), t = T.titleId && G.titles.find(x => x.id === T.titleId);
  if (w) { addPop(w, 4); w.morale = clamp(w.morale + 10, 0, 100); w.momentum = clamp(w.momentum + 10, -50, 50); }
  let prize = '';
  if (t && T.prize === 'title' && !t.holder.includes(wid) && w?.contract) { crown(t, [wid]); t.holder = [wid]; t.since = G.week; t.defenses = 0; t.lastDefense = G.week; STATS(w).tw++; prize = ` and is the new ${t.name} champion`; }
  else if (t && T.prize === 'shot') { t.contenders = [wid, ...(t.contenders || []).filter(x => x !== wid)].slice(0, 3); prize = ` and is now #1 contender for the ${t.name}`; }
  news(`🏆 ${nameOf(wid)} won the ${T.name}${prize}!`, 'title');
}
// record a tournament match; walkovers for anyone who has left
function tResult(seg, res) {

  const x = T.rounds[seg.tr]?.[seg.ti]; if (!x || x.adv) return;
  const w = res.winners.find(id => x.pair.includes(id));

}
function tWalkovers(T) {
  for (const { x } of tPending(T)) { const ok = x.pair.map(id => !!W(id)?.contract); if (ok[0] !== ok[1]) x.adv = x.pair[ok[0] ? 0 : 1]; }
  tAdvance(T);
}
function tSeg(T, r, i) {
  const x = T.rounds[r][i], s = blankSeg('match');
  s.sides = [[x.pair[0]], [x.pair[1]]]; s.tid = T.id; s.tr = r; s.ti = i;
  const t = T.titleId && G.titles.find(y => y.id === T.titleId);

// ---------- the end of a year: awards, aging, retirements ----------
// ---------- several companies in one world ----------
// The company being booked lives in G as always. The player's other companies wait in G.cos as snapshots
// holding their own roster, titles, stories, money and history. Free agents, retired legends, AI rivals,
// settings and the calendar are shared. Every company runs one show a week; the week moves on after the last one.
const SHARED_KEYS = new Set(['v', 'created', 'week', 'settings', 'wrestlers', 'rivalPromos', 'rivals', 'cos', 'savedAt', 'customMatch']);
const MAX_COS = 4;
const multi = () => !!(G && Array.isArray(G.cos) && G.cos.length);
const waitingCos = () => (G.cos || []).filter(c => (c.ranWk || 0) < G.week);
const doneThisWeek = () => multi() && (G.ranWk || 0) >= G.week;
const coNews = (c, text, cat) => { c.news ||= []; c.news.unshift({ wk: G.week, text, cat: cat || 'office' }); if (c.news.length > 400) c.news.length = 400; };
const worldNames = () => new Set(G ? [...G.wrestlers, ...(G.cos || []).flatMap(c => c.roster || []), ...(G.rivalPromos || []).flatMap(r => r.roster || [])].map(w => w.name) : []);
function coSnap() { const o = {}; for (const k of Object.keys(G)) if (!SHARED_KEYS.has(k)) o[k] = G[k]; o.roster = G.wrestlers.filter(w => w.contract); return o; }
function switchCo(id) {
  const i = (G.cos || []).findIndex(c => c.coId === id); if (i < 0) return false;
