function endOfWeek(card, world = true) {
  const booked = new Set(card.flatMap(segPeople));
  const s = signed();
  // a locker room leader sets the mood: happy leader, happier room; unhappy leader, the room follows
  const ld = G.leader && W(G.leader);
  if (G.leader && !ld?.contract) { if (ld) news(`👑 ${ld.name} is gone, and the locker room has no leader.`, 'office'); delete G.leader; }
  const room = !G.leader ? 0 : ld.morale >= 50 ? 4 : ld.morale < 35 ? -5 : 0;
  if (G.leader && room < 0 && Math.random() < 0.3) news(`😠 ${ld.name} is unhappy, and the locker room feels it.`, 'office');
  for (const w of G.wrestlers) {
    if (!world && !w.contract) continue;
    if (!booked.has(w.id)) w.fatigue = clamp(w.fatigue - 18, 0, 100); else w.fatigue = clamp(w.fatigue - 6, 0, 100);
    if (w.injury > 1 && w.contract && perk('medic') && Math.random() < 0.35) w.injury--;
    if (w.injury > 0 && !booked.has(w.id)) { w.injury--; if (w.injury === 0 && w.contract) news(`✅ ${w.name} is cleared to compete.`, 'injury'); }
    else if (w.injury > 0) w.injury = Math.max(0, w.injury - 0.5) | 0;
    w.momentum *= 0.92;
    if (!w.contract) { w.pop = clamp(w.pop - 0.15, 1, 100); continue; }
    if (!booked.has(w.id) && w.injury === 0 && G.week - w.lastBooked >= 2) w.morale = clamp(w.morale - 2.5, 0, 100);
    if (CON() && w.contract.salary < asking(w) * 0.75) w.morale = clamp(w.morale - 1, 0, 100);
    w.morale += (65 + room + (PER() ? ((w.trust ?? 50) - 50) / 5 : 0) - w.morale) * 0.02;
  }
  // champions gain from holding gold
  for (const t of G.titles) for (const id of t.holder) { const w = W(id); if (w) addPop(w, t.prestige / 400); }
  // stories cool down when ignored
  for (const st of G.stories.filter(x => x.status === 'active')) {
    if (st._touched !== G.week) {
      st.heat = clamp(st.heat - 6, 0, 100);
      if (st.heat <= 0) { st.status = 'ended'; st.ended = G.week; news(`🧊 The "${st.title}" storyline fizzled out from neglect.`, 'story'); }
    }
    // payoff at a big event when the two sides met in a match
    if (bigWk(G.week) && st.status === 'active') {
      const met = G.history.filter(h => h.wk === G.week && h.big).flatMap(h => h.results).find(r => r.seg.kind === 'match' && st.a.some(x => r.seg.sides.flat().includes(x)) && st.b.some(x => r.seg.sides.flat().includes(x)));
      if (met && st.autoEnd !== false) concludeStory(st, met);
    }
  }
  // contracts (frozen when contracts are off: nobody's deal runs down and nobody walks out)
  endLoans();
  for (const w of CON() ? signed().filter(w => !w.loan) : []) {
    w.contract.weeks--;
    const wl = w.contract.weeks;
    if (wl === TALKS_OPEN) news(`📝 ${w.name} has ${TALKS_OPEN} weeks left and is open to talks. Renew in the Office.`, 'contract');
    if (wl === 4) news(`📝 ${w.name}'s contract ends in 4 weeks.${w.courted ? ` ${w.courted} is circling.` : ''}`, 'contract');
    // the last 8 weeks: rival promotions call the bigger names
    if (wl > 0 && wl <= 8 && !w.courted && Math.random() < 0.04 + w.pop / 900 + (PER() && w.pers === 'money' ? 0.04 : 0)) {
      ensureRivals(); w.courted = G.rivals?.length ? pick(G.rivals) : 'A rival promotion';
      news(`🗞️ ${w.courted} is talking to ${w.name}, whose deal ends in ${wl} weeks. Their price just went up.`, 'contract');
    }
    if (wl <= 0) {
      const re = !w.courted && (w.morale > 60 || (PER() && w.trust >= 70)) && Math.random() < 0.15 + w.morale / 400 + (PER() ? (w.trust - 50) / 300 : 0);
      if (re) { w.contract.weeks = 4; news(`📝 ${w.name}'s contract ran out, but they agreed to work 4 more weeks on a handshake while you sort out a new deal.`, 'contract'); }
      else if (w.courted && Math.random() < 0.35 + w.pop / 200 - (PER() ? (w.trust - 50) / 200 + (w.pers === 'loyal' ? .15 : 0) : 0)) {
        const r = w.courted; leaveCompany(w, 'contract expired');
        const to = goRival(w, r); news(`✍️ ${w.name} signed with ${to} the moment their deal ended.`, 'contract');
      }
      else { leaveCompany(w, 'contract expired'); news(`📇 ${w.name} is a free agent. You can still make an offer, but rivals can too.`, 'contract'); }
    }
    else if (w.morale < 15 && Math.random() < 0.15) { news(`😠 ${w.name} is miserable and demanded their release. You let them walk.`, 'contract'); leaveCompany(w, 'demanded release'); }
  }
  // the rest of the wrestling world moves on
  const fa = world ? freeAgents() : [];
  if (fa.length && Math.random() < 0.12) { const w = pick(fa.filter(x => x.pop < 70).length ? fa.filter(x => x.pop < 70) : fa); const to = goRival(w); news(`🗞️ Free agent ${w.name} signed with ${to}.`, 'contract'); }
  rivalWeek(world);
  for (const T of G.tourneys || []) if (!T.done) tWalkovers(T);
  if (G.week % 52 === 0) yearEnd(world);
  if (world && (Math.random() < 0.25 || freeAgents().length < 6)) { const w = makeWrestler(randomName(), '', null, null, rnd(0.05, 0.75)); w.joined = G.week; G.wrestlers.push(w); news(`🆕 ${w.name} (${w.style}, ${w.align}) is now a free agent.`, 'contract'); }
  // TV deal renewals
  G.tvWeeks--;
  if (G.tvWeeks <= 0) {
    const recent = avg(G.history.slice(-12).map(h => h.rating));
    const old = G.tv; G.tv = Math.round((30000 * Math.pow(G.fans / 22000, 0.65) * (0.6 + recent / 100)) / 1000) * 1000; G.tvWeeks = 26;
    if (MON()) news(`📡 New TV deal: ${money(G.tv)} per week (was ${money(old)}), based on fans and recent show quality.`, 'office');
  }
  personaWeek(booked);
  if (G.settings.finances && G.money < 0) news('💸 You are in the red. Cut payroll or run bigger events.', 'office');
}

// ---------- rival promotions: real companies with rosters, champions and weekly shows ----------
const RIV_COLORS = ['#ff5a5f', '#4c8dff', '#2fbf71', '#a463f2', '#22b8cf', '#e84393', '#d35400'];
const RIV_SHOWS = ['Friday Night Fallout', 'Saturday Slam', 'Thursday Throwdown', 'Sunday Showdown', 'Wednesday War', 'Tuesday Turmoil'];
const RV = id => (G.rivalPromos || []).find(r => r.id === id);
function makeRival(name, o = {}) {
  name = String(name || 'Rival Promotion').slice(0, 40);
  return { id: uid(), name, short: (o.short || abbr(name)).slice(0, 5), color: safeColor(o.color) || pick(RIV_COLORS), prestige: clamp(o.prestige ?? rint(30, 60), 1, 100), fans: o.fans ?? rint(8000, 30000), show: o.show || pick(RIV_SHOWS), roster: [], champId: null, last: 0, hist: [], custom: !!o.custom };
}
function rivWrestler(w, r) { w.contract = null; delete w.courted; delete w._ask; w.rival = r.id; w.rWeeks = rint(26, 156); w.division ||= 'Open'; return w; }
function setRivalChamp(r) { if (!r.roster.some(w => w.id === r.champId)) r.champId = r.roster.slice().sort((a, b) => b.pop - a.pop)[0]?.id || null; }
function fillRival(r, n) { for (let i = 0; i < n; i++) r.roster.push(rivWrestler(makeWrestler(randomName(), '', null, null, rnd(0.1, 0.8)), r)); setRivalChamp(r); }
const syncRivals = () => { G.rivals = (G.rivalPromos || []).map(r => r.name); };
function ensureRivals() {
  if (Array.isArray(G.rivalPromos)) return;
  G.rivalPromos = (G.rivals?.length ? G.rivals : shuffle(RIVALS).slice(0, 2)).map(n => { const r = makeRival(n); fillRival(r, rint(10, 16)); return r; });
  syncRivals();
}
// the promotion a wrestler leaves for: named one if it exists, otherwise a big promotion with room
// a rival books a real card each week: a title main event and a few matches. Results move their wrestlers.
function rivalCard(r, sup) {
  const pool = r.roster.filter(w => !w.injury).sort((a, b) => (b.pop + (b.momentum || 0)) - (a.pop + (a.momentum || 0)));
  if (pool.length < 2) { r.card = { wk: G.week, segs: [] }; return; }
  const champ = pool.find(w => w.id === r.champId), used = new Set(), segs = [];
  const take = w => { used.add(w.id); return w; };
  const rate = (a, b, t) => Math.round(clamp((overall(a) + overall(b)) / 2 * 0.6 + r.last * 0.4 + (t ? 3 : 0) + rnd(-6, 6), 20, 98));
  const bout = (a, b, t) => {
    const pa = a.pop + (a.momentum || 0) + rnd(0, 40) + (t && a.id === r.champId ? 12 : 0), pb = b.pop + (b.momentum || 0) + rnd(0, 40) + (t && b.id === r.champId ? 12 : 0);
    const win = pa >= pb ? a : b, lose = win === a ? b : a;
    win.momentum = clamp((win.momentum || 0) + 3, -50, 50); lose.momentum = clamp((lose.momentum || 0) - 2, -50, 50); win.pop = clamp(win.pop + 0.3, 1, 100);
    if (t && win.id !== r.champId) { r.champId = win.id; news(`🏆 ${r.name}: ${win.name} beat ${lose.name} for their top title.`, 'office'); }
    return { an: a.name, bn: b.name, a: a.id, b: b.id, won: win.id, title: !!t, rating: rate(a, b, t) };
  };
  if (champ) { const ch = pool.find(w => w !== champ && w.align !== champ.align) || pool.find(w => w !== champ); if (ch) segs.push(bout(take(champ), take(ch), true)); }
  const rest = pool.filter(w => !used.has(w.id)).slice(0, sup ? 10 : 8);
  for (let i = 0; i + 1 < rest.length && segs.length < (sup ? 5 : 4); i += 2) segs.unshift(bout(rest[i], rest[i + 1], false));
  r.card = { wk: G.week, sup: !!sup, segs };
}
// a rival wrestler joins your roster: trades and invasions
function fromRival(w, r, contract) {
  r.roster = r.roster.filter(x => x !== w); delete w.rival; delete w.rWeeks; setRivalChamp(r);
  w.contract = contract; w.joined = G.week; w.lastBooked = G.week; w.morale = clamp(Math.max(w.morale || 60, 60), 0, 100);
  if (splitOn()) w.brand = G.showId;
  G.wrestlers.push(w);
}
// invaders go home when their 8 weeks are up
function endLoans() {
  for (const w of signed().filter(w => w.loan && G.week >= (w.loanUntil || 0))) {
    const r = RV(w.loan); leaveCompany(w, 'the invasion is over'); delete w.loan; delete w.loanUntil;
    if (r) { G.wrestlers = G.wrestlers.filter(x => x !== w); r.roster.push(rivWrestler(w, r)); setRivalChamp(r); news(`🚪 ${w.name} went back to ${r.name}.`, 'contract'); }
  }
}
function goRival(w, name) {
  ensureRivals();
  const rs = G.rivalPromos, r = rs.find(x => x.name === name) || rs.slice().sort((a, b) => (b.prestige - b.roster.length * 1.5 + rnd(0, 25)) - (a.prestige - a.roster.length * 1.5 + rnd(0, 25)))[0];
  G.wrestlers = G.wrestlers.filter(x => x !== w);
  if (r) { r.roster.push(rivWrestler(w, r)); setRivalChamp(r); }
  return r ? r.name : 'a rival promotion';
}
function rivalWeek(world = true) {
  ensureRivals();
  for (const r of world ? G.rivalPromos : []) {
    for (const w of r.roster.slice()) {
      w.pop = clamp(w.pop + rnd(-0.6, 0.8), 1, 100); w.fatigue = 0; if (w.injury) w.injury--;
      if (--w.rWeeks <= 0) {
        if (Math.random() < 0.6) w.rWeeks = rint(52, 156);
        else { r.roster = r.roster.filter(x => x !== w); delete w.rival; delete w.rWeeks; w.morale = 60; w.contract = null; G.wrestlers.push(w); news(`📇 ${w.name}'s deal with ${r.name} ended. They're a free agent.`, 'contract'); }
      }
    }
    const top = r.roster.slice().sort((a, b) => b.pop - a.pop).slice(0, 8);
    const sup = r.counter === G.week;
    r.last = top.length ? Math.round(clamp(avg(top.map(w => (w.pop + overall(w)) / 2)) * 0.55 + r.prestige * 0.25 + 15 + rnd(-6, 6) + (sup ? 8 : 0), 30, 97)) : 30;
    rivalCard(r, sup);
    r.hist = [...(r.hist || []).slice(-11), r.last];
    r.fans = Math.max(1000, Math.round(r.fans * (1 + (r.last - 60) / 2500)));
    r.prestige = clamp(r.prestige + (r.last - r.prestige) * 0.03, 1, 100);
    setRivalChamp(r);
    if (r.counter && r.counter < G.week) delete r.counter;
    if (r.roster.length < 30 && Math.random() < 0.1) { const fa = freeAgents().filter(w => w.pop < r.prestige + 20); if (fa.length) { const w = pick(fa); goRival(w, r.name); news(`🗞️ Free agent ${w.name} signed with ${r.name}.`, 'contract'); } }
  }
  // counter-programming: the biggest rival loads up a show against your next big event
  if (world && bigWk(G.week + 2) && !G.rivalPromos.some(r => r.counter === G.week + 2) && Math.random() < 0.5) {
    const r = G.rivalPromos.filter(r => r.roster.length >= 6).sort((a, b) => b.prestige - a.prestige)[0];
    if (r) { r.counter = G.week + 2; news(`📺 ${r.name} is running a loaded ${r.show} against ${bigName(G.week + 2)} in 2 weeks. If they beat you that night, they take twice the fans.`, 'office'); }
  }
  // the ratings war: a rival that beats your show takes a few of your fans
  const last = G.history.at(-1), best = G.rivalPromos.filter(r => r.roster.length).sort((a, b) => b.last - a.last)[0];
  if (last && best && last.wk === G.week) {
    const x2 = best.counter === G.week ? 2 : 1;
    if (x2 > 1 && last.rating > best.last + 3) news(`📈 Your ${last.name} beat ${best.name}'s loaded ${best.show}, ${last.rating} to ${best.last}.`, 'office');
    if (best.last > last.rating + 3) { const loss = Math.round(G.fans * 0.001 * x2 * Math.min(4, (best.last - last.rating) / 4) * DF().rival); G.fans = Math.max(1000, G.fans - loss); best.fans += loss; if (Math.random() < 0.5 || best.last > last.rating + 10) news(`📉 ${best.name}'s ${best.show} (${best.last}) beat your show (${last.rating}). About ${kfmt(loss)} fans watched them instead.`, 'office'); }
    else if (last.rating > best.last + 3) { const gain = Math.round(x2 * Math.min(best.fans * 0.004, G.fans * 0.002) * Math.max(0.1, 1 - G.fans / fanCap())); best.fans = Math.max(1000, best.fans - gain); G.fans += gain; if (Math.random() < 0.4) news(`📈 You won the week: ${last.rating} to ${best.name}'s ${best.last}.`, 'office'); }
  }
}
function leaveCompany(w, why) {

function concludeStory(st, met) {
  st.status = 'ended'; st.ended = G.week; carBump('payoffs'); award('payoff');
  let winSide = null;
  if (met && met.winners?.length) winSide = st.a.some(x => met.winners.includes(x)) ? 'a' : 'b';

    st[winSide === 'a' ? 'b' : 'a'].forEach(id => { const w = W(id); if (w) addPop(w, bonus / 3); });

  st.log.unshift({ wk: G.week, text: '🏁 ' + txt });

function ensureGoals() {

// ---- booker career: level, achievements, milestones ----
// The career belongs to the player, not to one company: it lives in its own browser key and carries into every save.
// Each company still keeps its own G.booker (weekly goals, the trophies it earned) so older saves and shared saves work.

// ---- crowd reactions ----
// How the crowd feels about what happened, worked out before the turns and title changes are applied,
// so the crowd line and the crowd sound both follow the actual result.
// m: cheer | heat (boos) | champF | champH | mixed | chaos | flat | polite | dead. k: how big (0 to 1).
function cueOf(seg, res, ctx = {}) {

    const faceLost = (res.losers || []).map(W).some(w => w?.align === 'face');
    let booed = wHeel || (!ws.length ? false : (fk === 'Cheating' && wFace) || (fk === 'Screwjob' && faceLost));
    if (tw) booed = tw.align === 'face'; // someone turning heel gets booed, turning face gets cheered
    m = !ws.length ? (seg.finish === 'No Contest' || fk === 'DQ' ? 'chaos' : 'mixed') : changed ? (booed ? 'champH' : 'champF') : booed ? 'heat' : 'cheer';
  } else if (seg.kind === 'promo') {
    const sp = (seg.who || []).map(W).filter(Boolean), a = sp.length ? sp : ppl;
    m = res.land != null && res.land <= -4 ? 'flat' : ws.length ? (wHeel ? 'heat' : 'cheer') : a.every(w => w.align === 'heel') ? 'heat' : a.every(w => w.align === 'face') ? 'cheer' : 'mixed';
  } else {
    const at = seg.atype, d = (seg.who || []).map(W).filter(Boolean);
    m = at === 'Turn Heel' ? 'heat' : at === 'Turn Face' || at === 'Debut / Return' ? 'cheer' : at === 'Contract Signing' ? 'chaos' : at === 'Backstage Skit' ? 'polite'
      : ws.length ? (wHeel ? 'heat' : 'cheer') : d.length && d.every(w => w.align === 'heel') ? 'heat' : 'cheer';
  }
  return { in: cin, m, k: Math.round(k * 100) / 100, near: seg.kind === 'match' && x >= 65 && m !== 'dead' };
}

function autoFill(quiet) {

    let any = false;

      const ref = W(s.sides.flat()[0]), al = s.sides.flat().length && W(s.sides.flat()[0])?.align === 'face' && i > 0 ? 'heel' : 'face';
      const pool = avail().filter(w => sameDiv(ref, w)).sort((a, b) => (b.align === al) - (a.align === al) || b.pop - a.pop).slice(0, need);
      pool.forEach(w => sd.push(w.id)); take(pool.map(w => w.id)); if (pool.length) any = true; });
    if (any) filled++; take(s.sides.flat());

  const segs = [];

  const nb = !big && nextBig(), pms = nb && nb > wk ? ppvMatches(nb) : [];
  const ppvSaved = ids => pms.some(m => buildsFor({ kind: 'match', sides: [ids] }, m) === 2);
  // stories first: on big events pay them off, otherwise build with promos/matches

function storyIdea() {
  const busy = new Set(G.stories.filter(s => s.status === 'active').flatMap(s => [...s.a, ...s.b]));
  // don't re-suggest a feud that just ended; fresh pairings first
  const recent = new Set(G.stories.filter(s => s.status !== 'active' && s.ended >= G.week - 3).flatMap(s => [...s.a, ...s.b]));
  const base = signed().filter(w => !busy.has(w.id) && w.injury === 0).sort((a, b) => b.pop - a.pop);
  const fresh = base.filter(w => !recent.has(w.id));
  const pool = fresh.some(w => w.align === 'face') && fresh.some(w => w.align === 'heel') ? fresh : base;
  const f = pool.find(w => w.align === 'face'), h = pool.find(w => w.align === 'heel');
  return f && h ? [f.id, h.id] : null;
}

}

// ---------- roster ----------
function viewRoster() {
  const q = UI.rosterQ.toLowerCase();
  let list = signed();
  const f = UI.rosterF;
  if (DIVISIONS.includes(f)) list = list.filter(w => (w.division || 'Open') === f);
  if (f === 'face' || f === 'heel') list = list.filter(w => w.align === f);
  if (f === 'injured') list = list.filter(w => w.injury > 0);
  if (f === 'champs') list = list.filter(w => titlesOf(w.id).length);
  if (f === 'unhappy') list = list.filter(w => w.morale < 45);
  if (String(f).startsWith('b:')) list = list.filter(w => brandOf(w) === f.slice(2));
  if (q) list = list.filter(w => (w.name + ' ' + w.nick + ' ' + w.style).toLowerCase().includes(q));
  let s = UI.rosterSort;
  if (s === 'contract' && !CON()) s = 'pop';
  list.sort((a, b) => s === 'wins' ? b.record.w - a.record.w : s === 'winpct' ? winPct(b) - winPct(a) : s === 'streak' ? (b.streak || 0) - (a.streak || 0) : s === 'name' ? a.name.localeCompare(b.name) : s === 'contract' ? a.contract.weeks - b.contract.weeks : s === 'morale' ? a.morale - b.morale : s === 'fatigue' ? b.fatigue - a.fatigue : b[s] - a[s]);
  const divs = DIVISIONS.filter(d => signed().some(w => (w.division || 'Open') === d));
  const filt = `<div class="filters">${[['all', 'All'], ['teams', 'Teams & factions'], ['face', 'Faces'], ['heel', 'Heels'], ['champs', 'Champions'], ['injured', 'Injured'], ['unhappy', 'Unhappy'], ...(splitOn() ? SHOWS().map(x => ['b:' + x.id, brandName(x.id)]) : []), ...(divs.length > 1 ? divs.map(d => [d, d]) : [])].map(([k, l]) => `<button class="${f === k ? 'on' : ''}" data-act="rosterF" data-id="${k}">${l}</button>`).join('')}</div>`;
  if (f === 'teams') return `<div class="grid4" style="margin-bottom:12px"><button class="btn sm tool" data-act="createW"><b>＋</b>Build</button><button class="btn sm tool" data-act="rosterTools"><b>⇅</b>Import</button><button class="btn sm tool" data-act="community"><b>🌐</b>Community</button><button class="btn sm tool" data-act="rankings"><b>📈</b>Rankings</button></div>${filt}
    <div class="small muted" style="margin-bottom:8px">Teams that stay together get better. They earn a chemistry bonus that grows with every win.</div>
    <div class="list">${(G.teams || []).map(t => { const gone = t.members.filter(id => !W(id)?.contract).length; return `<button class="item" data-act="editTeam" data-id="${t.id}"><div class="av" style="width:40px;height:40px;font-size:12px;background:var(--card2)">👥</div><div class="main"><div class="t">${esc(t.name)}</div><div class="d">${t.members.map(id => esc(nameOf(id))).join(' & ') || 'No members'} · <b>${teamRec(t)}</b>${gone ? ` · <span style="color:var(--bad)">${gone === t.members.length ? 'all gone' : gone + ' gone'}</span>` : ''}</div></div></button>`; }).join('') || '<div class="empty">No teams yet. Pair up two or more wrestlers.</div>'}</div>
    <div class="grid2" style="margin-top:12px"><button class="btn pri" data-act="editTeam" data-id="">+ New team</button><button class="btn pri" data-act="editFaction" data-id="">+ New faction</button></div>
    <div class="sec">Factions</div>
    <div class="small muted" style="margin-bottom:8px">Bigger groups of up to 8. A faction can hold whole tag teams, and any 2 or more members on the same side fight as the faction.</div>
    <div class="list">${(G.factions || []).map(f => { const ts = f.tms.map(TM).filter(Boolean), solo = f.members.filter(id => !ts.some(t => t.members.includes(id))); return `<button class="item" data-act="editFaction" data-id="${f.id}"><div class="av" style="width:40px;height:40px;font-size:12px;background:var(--card2);color:var(--accent-t)">👑</div><div class="main"><div class="t">${esc(f.name)} <span class="tiny muted">${f.members.length} members</span></div><div class="d">${[...ts.map(t => '<b>' + esc(t.name) + '</b>'), ...solo.map(id => esc(nameOf(id)) + (id === f.leader ? ' (leader)' : ''))].join(' · ') || 'No members'} · ${teamRec(f)}</div></div></button>`; }).join('') || '<div class="empty">No factions yet.</div>'}</div>`;
  return `
  <div class="grid4" style="margin-bottom:12px"><button class="btn sm tool" data-act="createW"><b>＋</b>Build</button><button class="btn sm tool" data-act="rosterTools"><b>⇅</b>Import</button><button class="btn sm tool" data-act="community"><b>🌐</b>Community</button><button class="btn sm tool" data-act="rankings"><b>📈</b>Rankings</button></div>
  <div class="row" style="margin-bottom:10px"><input type="search" placeholder="Search roster" aria-label="Search roster" value="${esc(UI.rosterQ)}" data-in="rosterQ" style="flex:1">
    <select data-in="rosterSort" style="width:auto" aria-label="Sort roster by">${[['pop', 'Popularity'], ['ring', 'In-ring'], ['mic', 'Mic'], ['morale', 'Morale (low first)'], ['fatigue', 'Fatigue'], ...(CON() ? [['contract', 'Contract (ending first)']] : []), ['wins', 'Wins'], ['winpct', 'Win %'], ['streak', 'Win streak'], ['name', 'Name']].map(([k, l]) => `<option value="${k}" ${s === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
  ${filt}
  <div class="small muted" style="margin-bottom:8px">${list.length} of ${signed().length} signed${CON() && MON() ? ` · payroll ${money(sum(signed().map(w => w.contract.salary)))}/wk` : ''}</div>
  <div class="list">${list.map(w => wItem(w)).join('') || (signed().length ? '<div class="empty">Nobody matches.</div>' : '<div class="empty">Your roster is empty. Build, import or grab one from Community.</div>')}</div>`;
}

// ---- cloud saves (Supabase): one row per player in cloud1..cloud3, readable only by that player ----
const CLOUD_SLOTS = [1, 2, 3];
const cloudErr = e => e?.code === 'full' ? FULL_MSG : e?.code === 'big' ? 'This save is too big for the cloud. Use Back up instead.' : e?.code === 'permission-denied' ? 'Cloud saves are not set up yet. Try again later.' : 'Could not reach the cloud. Check your connection.';
async function cloudPush(n) {
  await sbGuest(); if (!sbSess?.user?.id) throw { code: 'unavailable' };
  const z = await gz(JSON.stringify({ ...G, savedAt: Date.now() }));
  if (z.length > 380000) throw { code: 'big' };
  await sbDb().doc(`cloud${n}/${sbSess.user.id}`).set({ v: 1, save: z, sum: saveSummary(G), at: Date.now() });
  meta.cloudWk = { ...(meta.cloudWk || {}), [n]: G.week }; ls.set(META, JSON.stringify(meta));
}
async function cloudList() {
  const m = UI.modal; if (m?.type !== 'cloud') return;
  try {
    await sbGuest(); const id = sbSess?.user?.id; if (!id) throw 0;
    const rows = await sbFetch(`/rest/v1/docs?select=col,data->sum,data->at&col=in.(cloud1,cloud2,cloud3)&id=eq.${sbQ(id)}`);
    const list = {}; for (const r of Array.isArray(rows) ? rows : []) { const n = +String(r.col).slice(5); if (CLOUD_SLOTS.includes(n)) list[n] = { sum: r.sum && typeof r.sum === 'object' ? r.sum : {}, at: +r.at || 0 }; }
    if (UI.modal === m) { m.list = list; m.err = ''; render(); }
  } catch (e) { if (UI.modal === m) { m.list = {}; m.err = cloudErr(e); render(); } }
}
// after each week, the game backs itself up when auto backup is on
let cloudBusy = false;
function cloudAutoPush() {
  if (!meta.cloudAuto || !sbOn() || !G || cloudBusy || meta.cloudWk?.[meta.slot] === G.week) return;
  cloudBusy = true; cloudPush(meta.slot).catch(() => {}).finally(() => { cloudBusy = false; });
}
function modalCloud(m) {
  const u = sbSess?.user, L = m.list;
  const rows = CLOUD_SLOTS.map(n => { const x = L?.[n], sm = x?.sum || {};
    return `<div class="item"><div class="av" style="background:${n === meta.slot ? 'var(--accent)' : 'var(--card2)'};color:${n === meta.slot ? 'var(--accent-ink)' : 'var(--ink)'}">${n}</div><div class="main"><div class="t">${x ? esc(String(sm.promo || 'Saved game')) : 'Empty'}</div><div class="d">${x ? `Week ${+sm.week || '?'} · ${x.at ? new Date(x.at).toLocaleString() : ''}` : L ? '—' : 'Loading…'}</div></div>

    ${m.err ? `<div class="alert bad"><span class="ic">⚠️</span><div class="small">${esc(m.err)}</div></div>` : ''}

  <p>1. Tap a week on the calendar.<br>2. Add matches, promos and angles, or tap Auto-fill.<br>3. Tap <b>Run</b> and watch the results.<br>4. Check the <b>Briefing</b> and the <b>Office</b>.</p>
  <h3>Big events</h3>
  <p><b>Plan the big event first.</b> Tap its week on the calendar and book its main matches before the weekly shows. Those matches are announced, and every weekly show that puts both sides together builds hype. More hype means better ratings and more buys.</p>
  <p>Plans can change. If a story gets hotter than expected, the Road to card offers to add it, or you can edit the big event's card any time before the show.</p>
  <h3>Rank and goals</h3>
  <p>Shows earn XP toward your booker rank. Weekly goals give bonus XP. Backstage moments pop up between shows. Pick what happens.</p>
  <h3>Stats</h3>
  <p><b>Popularity</b>: how much fans care.<br><b>In-ring</b>, <b>Mic</b>, <b>Charisma</b>: match, promo and angle quality.<br><b>Fatigue</b>: lowers ratings and raises injury risk. Rest to recover.<br><b>Morale</b>: unhappy wrestlers do worse and may leave.<br><b>Momentum</b>: grows with wins.</p>
  <h3>Matches</h3>
  <p>Pick the type, stipulation, winner and finish. Face vs heel works best. Records matter: streaks draw fans and contenders make better title matches. Avoid repeats. The last segment is the main event.</p>
  <h3>Storylines</h3>
  <p>Start one yourself, or let them grow from your booking: rematches after a title change, revenge for a broken streak, betrayals, great matches and repeat clashes. Put both sides together to build heat. Pay it off with a match at a big event.</p>
  <h3>Rival promotions</h3>
  <p>Office → <b>Rivals</b>. Rivals run weekly shows, sign free agents and compete for your fans. Create your own, or import any roster and pick <b>Make it a rival promotion</b>. Tap <b>Sign</b> on a rival wrestler to try to lure them away.</p>
  <h3>Teams and tournaments</h3>
  <p>Roster → <b>Teams &amp; factions</b> pairs up 2 to 4 wrestlers as a team, or groups up to 8 as a faction. A faction can hold whole tag teams, and any 2 or more of its members on one side fight as the faction. Teams get better the more they win, and you can pick a whole team in one tap. Office → Titles → <b>Run a tournament</b> builds a 4, 8 or 16 person bracket for a vacant title, a title shot or bragging rights. Add each round to a show.</p>
  <h3>History and rankings</h3>
  <p>Every title keeps its full list of reigns. Roster → <b>Rankings</b> shows the top 10 in each division and the top teams. At the end of each year (week 52) the awards are handed out, everyone ages a year, and older wrestlers may retire. Bring a legend back from Office → Titles → History &amp; awards. Aging can be switched off in Settings.</p>
  <h3>Changed your mind?</h3>
  <p>Right after a show you can <b>Undo</b> it and book it again. <b>Copy as text</b> shares a card or results anywhere.</p>
  <h3>Contracts</h3>
  <p>Renew before a deal runs out. The offer screen shows the odds of a yes.</p>
  <h3>Your roster</h3>
  <p>Roster → <b>Build</b> makes a new wrestler. <b>Import / export</b> loads rosters from a code, file or spreadsheet. <b>Community</b> has rosters, wrestlers and saves from other players.</p>
   <p>In Community, <b>My profile</b> sets your name, bio and color. Your account is your claude.ai sign-in. Tap ❤️ to like a creation, tap a creator to see their page and follow them, and sort by Popular, New or Following.</p>
  <h3>Saving</h3>
  <p>The game saves itself in this browser. You have 3 slots. Export a save to move it to another device.</p></div>`;
}

function mtDesc(c, gim) {
  if (!gim) return c.ffa ? `${c.count} entrants, everyone for themselves${c.wide ? ', roster-wide' : ''}` : `${c.teams} sides of ${c.per}`;
  return [GM_RULES[c.rule] || 'Normal rules', c.style ? c.style + 's shine' : '', GM_RISK[c.risk]?.l + ' risk', ['Low', 'Medium', 'High'][c.heat] + ' heat', c.long ? 'long match' : ''].filter(Boolean).join(' · ');
}
// keep booked matches and signature matches pointing at a renamed (or deleted) type or gimmick
function renameMatchKind(kind, from, to) {
  const key = kind === 'gim' ? 'stip' : 'mtype', sk = kind === 'gim' ? 'gm' : 'mt', plain = to === 'Singles' || to === 'Standard';
  for (const c of [G, ...(G.cos || [])]) {
    const cards = [c.card, ...Object.values(c.future || {}), ...(c.shows || []).flatMap(x => [x.card, ...Object.values(x.future || {})])];
    for (const card of cards) if (Array.isArray(card)) for (const s of card) if (s && s.kind === 'match' && s[key] === from) {
      s[key] = to;
      if (key === 'mtype' && plain) { s.sides = s.sides.filter(x => x.length).slice(0, 2).map(x => x.slice(0, 1)); while (s.sides.length < 2) s.sides.push([]); delete s.n; s.winner = -1; }
      if (key === 'stip') s.finish = finOf(s);
    }
    if (Array.isArray(c.ppvSig)) { for (const sg of c.ppvSig) if (sg && sg[sk] === from) sg[sk] = plain ? '' : to; c.ppvSig = c.ppvSig.filter(x => x && (x.mt || x.gm)); }
  }
}

function commit(msg) { save(); render(); if (msg) toast(msg); }
function openModal(m) { UI.modal = m; render(); }

function confirmBox(title, text, yes, fn, danger) { UI.modal = { type: 'confirm', title, text, yes, fn, danger, prev: UI.modal }; render(); }

const A = {
  tab(id) { UI.tab = id; UI.modal = null; render(); window.scrollTo(0, 0); },
  about() { openModal({ type: 'about' }); },
  textSize(k) { meta.text = ['s', 'm', 'l', 'xl'].includes(k) ? k : 'm'; ls.set(META, JSON.stringify(meta)); applyTheme(); render(); },
  whatsNew() { UI.modal = { type: 'whatsnew' }; render(); },
  menu() { openModal({ type: 'menu' }); },
  cloud() { openModal({ type: 'cloud', list: null }); cloudList(); },
  async cloudUp(n) {
    if (!G) return; const go = async () => { try { await cloudPush(+n); toast('Uploaded to cloud slot ' + n + '.'); cloudList(); } catch (e) { toast(cloudErr(e)); } };
    if (UI.modal?.list?.[n]) confirmBox('Replace cloud slot ' + n + '?', 'The game saved there is replaced with this one.', 'Replace', go); else go();
  },
  cloudGet(n) {
    const x = UI.modal?.list?.[n]; if (!x) return;
    confirmBox('Load this cloud save?', `${x.sum?.promo || 'This game'}, week ${x.sum?.week || '?'}, goes into slot ${meta.slot}, replacing the game there.`, 'Load it', async () => {
      try { const d = (await sbDb().doc(`cloud${+n}/${sbSess.user.id}`).get()).data(); if (!d?.save) throw { code: 'gone' };
        const g = sanitizeGame(JSON.parse(await ungz(d.save))); G = g; save(); UI.modal = null; UI.tab = 'book'; UI.selWeek = G.week; render(); toast('Cloud save loaded into slot ' + meta.slot + '.'); }
      catch (e) { toast(e?.code === 'gone' ? 'That cloud save is gone.' : 'Could not load it. Try again.'); }
    });
  },
  cloudDel(n) { confirmBox('Delete cloud slot ' + n + '?', 'Saves on this device are not touched.', 'Delete', async () => { try { await sbDb().doc(`cloud${+n}/${sbSess.user.id}`).delete(); toast('Deleted.'); cloudList(); } catch (e) { toast(cloudErr(e)); } }, true); },
  cloudAuto() { meta.cloudAuto = !meta.cloudAuto; ls.set(META, JSON.stringify(meta)); if (meta.cloudAuto && G) cloudPush(meta.slot).then(() => cloudList(), e => toast(cloudErr(e))); render(); },
  help() { openModal({ type: 'help' }); },
  closeModal,
  openRival(id) { openModal({ type: 'rival', id }); },
  newRival() { openModal({ type: 'editRival', isNew: true, draft: { name: '', short: '', show: '', color: pick(RIV_COLORS), prestige: 45, size: '14' } }); },
  editRival(id) { const r = RV(id); if (r) openModal({ type: 'editRival', draft: { id: r.id, name: r.name, short: r.short, show: r.show, color: r.color, prestige: Math.round(r.prestige) } }); },
  saveRival() {
    const d = UI.modal.draft, name = String(d.name || '').trim().slice(0, 40); if (!name) return toast('Give it a name.');
    ensureRivals();
    let r = d.id && RV(d.id);
    if (!r) { r = makeRival(name, { custom: true }); G.rivalPromos.push(r); fillRival(r, +d.size || 0); news(`🏢 ${name} opened as a rival promotion.`, 'office'); }
    r.name = name; r.short = (String(d.short || '').trim() || abbr(name)).slice(0, 5); r.show = String(d.show || '').trim().slice(0, 40) || r.show;
    r.color = safeColor(d.color) || r.color; r.prestige = clamp(+d.prestige || 40, 1, 100);
    syncRivals(); UI.modal = { type: 'rival', id: r.id }; commit('Saved.');
  },
  delRival() {
    const r = RV(UI.modal.draft.id); if (!r) return;
    confirmBox('Close ' + r.name + '?', 'Their wrestlers become free agents.', 'Close it', () => {
      for (const w of r.roster) { delete w.rival; delete w.rWeeks; w.contract = null; G.wrestlers.push(w); }
      G.rivalPromos = G.rivalPromos.filter(x => x !== r); syncRivals();
      news(`🏚️ ${r.name} closed. ${r.roster.length} wrestlers are free agents.`, 'office'); commit();
    }, true);
  },
  poach(id) {
    const r = (G.rivalPromos || []).find(x => x.roster.some(w => w.id === id)), w = r?.roster.find(x => x.id === id); if (!w) return;
    if (w.poachWk && G.week - w.poachWk < 4) return toast(`${w.name} said no recently. Try again in ${4 - (G.week - w.poachWk)} week${4 - (G.week - w.poachWk) > 1 ? 's' : ''}.`);
    const cost = MON() ? Math.round(askFor(w, 52) * Math.min(w.rWeeks || 26, 52) * 0.3 / 1000) * 1000 : 0;
    const odds = clamp(0.35 + (G.promo.prestige - r.prestige) / 120 + (r.champId === w.id ? -0.15 : 0) + (w.pop < 45 ? 0.1 : 0), 0.08, 0.85);
    confirmBox(`Sign ${w.name}?`, `${cost ? `Buy out their ${r.name} deal for ${money(cost)}, paid only if they say yes. ` : ''}Chance they say yes: ${Math.round(odds * 100)}%.`, 'Make the offer', () => {
      UI.modal = { type: 'rival', id: r.id };
      if (cost && G.money < cost) return commit('Not enough money for the buyout.');
      w.poachWk = G.week;
      if (Math.random() < odds) {
        r.roster = r.roster.filter(x => x !== w); delete w.rival; delete w.rWeeks;
        w.contract = { salary: CON() ? askFor(w, 52) : 0, weeks: 52 }; w.joined = G.week; w.lastBooked = G.week; w.morale = 70; G.wrestlers.push(w);

const CREATOR_ACTIONS = {
  rosterTools(tab) { openModal({ type: 'rtools', tab: tab || 'import', mode: G && signed().length ? 'sign' : 'replace' }); },
  rtTab(t) { UI.modal.tab = t; UI.modal.res = null; render(); },
  rtPhotos() {
    const m = UI.modal; if (!G || m.busy) return;
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
    inp.onchange = async () => {
      const files = [...inp.files].slice(0, 300); if (!files.length) return;
      const norm = v => String(v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
      const keys = []; for (const w of G.wrestlers) for (const k of [w.name, w.nick]) { const n = norm(k); if (n.length >= 3) keys.push([n, w]); }
      keys.sort((a, b) => b[0].length - a[0].length);
      const res = { ok: [], miss: [] };
      for (let i = 0; i < files.length; i++) {
        const f = files[i], base = f.name.replace(/\.[^.]+$/, ''), nb = norm(base);
        const w = (keys.find(([k]) => k === nb) || keys.find(([k]) => nb.includes(k)))?.[1];
        if (!w) { res.miss.push(base.slice(0, 40)); continue; }
        m.busy = (i + 1) + ' of ' + files.length; if (UI.modal === m) render();
        try {
          const img = new Image(), url = URL.createObjectURL(f);
          await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
          const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
          const sz = Math.min(img.width, img.height); x.drawImage(img, (img.width - sz) / 2, (img.height - sz) / 2 * 0.6, sz, sz, 0, 0, 256, 256); URL.revokeObjectURL(url);
          w.photo = safePhoto(pixelize(c, { detail: 48, colors: 10, zoom: 1, bg: 'color' }, w.color)); w.photoLocal = true; delete w.photoGen; res.ok.push(w.name);
        } catch (e) { res.miss.push(base.slice(0, 40)); }
      }
      m.busy = null; m.res = res; commit(res.ok.length ? `Added ${res.ok.length} private photo${res.ok.length > 1 ? 's' : ''}.` : 'No photos matched a wrestler.');
    };
    inp.click();
  },
  rtPlace(k) { let n = 0; for (const w of G.wrestlers) if (k === 'redo' ? w.photoGen : !w.photo) { w.photo = placeholderPic(w.id + ':' + Math.random(), w.color, w.division === "Women's"); w.photoGen = true; n++; } commit(n ? `${k === 'redo' ? 'Rerolled' : 'Added'} ${n} placeholder${n > 1 ? 's' : ''}.` : 'Everyone already has a picture.'); },
  rtPlaceOff() { for (const w of G.wrestlers) if (w.photoGen) { w.photo = ''; delete w.photoGen; } commit('Placeholders removed.'); },
  rtPhotosOff() { confirmBox('Remove private photos?', 'Wrestlers with a private photo go back to their initials. Other photos stay.', 'Remove', () => { for (const w of G.wrestlers) if (w.photoLocal) { w.photo = ''; delete w.photoLocal; } UI.modal = { type: 'rtools', tab: 'photos' }; commit('Removed.'); }, true); },
  rtParse() { const m = UI.modal; m.text = document.getElementById('rtIn').value; const r = parseImport(m.text); m.parsed = r.pack || null; m.error = r.error || ''; render(); rtTop(); },
  rtBack() { const m = UI.modal; m.parsed = null; m.error = ''; render(); rtTop(); },
  rtFile() { const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,.txt,.csv,.tsv,application/json,text/*'; inp.onchange = () => { const f = inp.files[0]; if (!f) return; if (f.size > MAX_FILE) return toast('That file is too big to import.'); f.text().then(t => { UI.modal.text = t; const r = parseImport(t); UI.modal.parsed = r.pack || null; UI.modal.error = r.error || ''; render(); rtTop(); }); }; inp.click(); },
  rtMode(k) { UI.modal.mode = k; render(); },
  rtImport() {

    if (m.mode === 'rival') {

// ---------- wrestler personalities (optional: G.settings.persona) ----------
// Each wrestler gets a personality, a trust level in you (0-100) and a short memory of how you treated them.
// They text you after shows and between weeks, and some texts ask for something. A promise has a deadline:
// keep it and trust goes up, break it and they remember. With the option off none of this runs.
const PER = () => !!G?.settings?.persona;
const PERS = {
  ego: { n: 'Glory hound', ic: '👑', d: 'Wants wins and main events. Big losses sting.' },
  loyal: { n: 'Loyal', ic: '❤️', d: 'Forgives easily, rarely asks for much and hates to leave.' },
  hot: { n: 'Hothead', ic: '🔥', d: 'Big reactions both ways. Wants payback after a loss.' },
  money: { n: 'Money first', ic: '💰', d: 'Pay matters most. Easier for rivals to tempt.' },
  star: { n: 'Spotlight seeker', ic: '🎤', d: 'Wants TV time and the mic. Hates sitting at home.' },
  team: { n: 'Team player', ic: '👥', d: 'Happy to help others. Losing does not bother them much.' }

function persFor(w) {
  const wt = { ego: 1 + (w.pop >= 60 ? 1.2 : 0), loyal: 1 + (w.age >= 33 ? .6 : 0), hot: 1 + (w.style === 'Brawler' ? 1 : 0), money: 1 + (w.pop >= 50 ? .4 : 0), star: 1 + (w.style === 'Showman' || w.mic >= 70 ? 1 : 0), team: 1 + (w.age >= 35 || w.style === 'Technician' ? .6 : 0) };
  let r = Math.random() * sum(Object.values(wt));
  for (const [k, v] of Object.entries(wt)) if ((r -= v) <= 0) return k;
  return 'team';
}
function ensurePers() {
  const first = !Array.isArray(G.phone);

  if (!Array.isArray(G.promises)) G.promises = [];
  G.phone = G.phone.filter(m => m && typeof m === 'object' && typeof m.t === 'string');
  G.promises = G.promises.filter(p => p && ASKS[p.key] && W(p.wid));
  for (const w of G.wrestlers) {
    if (!Object.hasOwn(PERS, w.pers)) w.pers = persFor(w);
    w.trust = clamp(isFinite(+w.trust) && w.trust !== null ? +w.trust : 50, 0, 100);
    if (!Array.isArray(w.mem)) w.mem = [];
  }
  // the first time it's on, someone reaches out so the player finds their phone
  const top = first && signed().filter(w => !w.loan).sort((a, b) => b.pop - a.pop)[0];
  if (top) textFrom(top, `Hey, it's ${top.name.split(' ')[0]}. Got your number from the office. I'll text you when something's on my mind.`);

// trust moves more or less depending on who they are
function remember(w, v, t) {
  if (!w) return;
  const k = w.pers === 'hot' ? 1.5 : w.pers === 'money' ? .7 : w.pers === 'loyal' && v < 0 ? .5 : 1;

  if (G.phone.length > 40) G.phone.length = 40;
}

const openAsk = w => (G.phone || []).some(m => m.wid === w.id && m.ask && m.ans == null) || (G.promises || []).some(p => p.wid === w.id);
const mainedIn = (w, n) => G.history.filter(h => h.wk > G.week - n).some(h => h.results.length > 1 && segPeople(h.results.at(-1).seg).includes(w.id));
const promoIn = (w, n) => G.history.filter(h => h.wk > G.week - n).some(h => h.results.some(r => r.seg.kind === 'promo' && (r.seg.who || []).includes(w.id)));
const shotAt = w => G.titles.find(t => !t.tag && t.holder.length && !t.holder.includes(w.id) && contenders(t, 6).some(x => x.id === w.id));
// what a wrestler can ask for: who asks, how long you get, and what counts as keeping your word
const ASKS = {
  main: { who: w => w.pers === 'ego' && w.pop >= 40 && !mainedIn(w, 4), wk: 3, what: () => 'a main event',
    ask: () => 'I should be closing shows, not opening them. Put me in a main event in the next 3 weeks.',
    met: (p, r, main) => main && segPeople(r.seg).includes(p.wid) },
  shot: { who: w => ['ego', 'hot', 'star'].includes(w.pers) && w.pop >= 50 && shotAt(w), wk: 5, b: w => shotAt(w).id, what: p => `a ${G.titles.find(t => t.id === p.b)?.short || 'title'} title shot`,

// ---------- sound: made on the fly with Web Audio, no files ----------
const SFX = (() => {
  let ctx = null, loading = false;
  const CLIPS = ['cheer', 'applause', 'ooh', 'boo'], bufs = {};
  const on = () => meta.sound !== false;
  const ac = () => { if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); } if (ctx.state === 'suspended') ctx.resume(); return ctx; };
  const tone = (f, t, d, type = 'sine', v = .2, f2) => { const c = ac(); if (!c) return; const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, c.currentTime + t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, c.currentTime + t + d); g.gain.setValueAtTime(0, c.currentTime + t); g.gain.linearRampToValueAtTime(v, c.currentTime + t + .01); g.gain.exponentialRampToValueAtTime(.0008, c.currentTime + t + d); o.connect(g).connect(c.destination); o.start(c.currentTime + t); o.stop(c.currentTime + t + d + .05); };
  return {
    bell(n = 3) { if (!on()) return; for (let i = 0; i < n; i++) { tone(1568, i * .32, 1.1, 'sine', .22); tone(2350, i * .32, .7, 'sine', .08); tone(3920, i * .32, .25, 'triangle', .04); } },
    tap() { if (!on()) return; tone(880, 0, .05, 'sine', .04); },
    // recorded crowd clips (public domain / CC0, see README), fetched once and kept
    load() { if (!on() || loading) return; const c = ac(); if (!c) return; loading = true;
      for (const k of CLIPS) fetch('sounds/' + k + '.mp3').then(r => r.ok ? r.arrayBuffer() : Promise.reject()).then(b => new Promise((ok, no) => c.decodeAudioData(b, ok, no))).then(b => { bufs[k] = b; }).catch(() => {}); },
    crowd(k, v = 1, t = 0) { if (!on()) return; const c = ac(), b = bufs[k]; if (!c || !b) return; const T = c.currentTime + t, s = c.createBufferSource(), g = c.createGain();
      s.buffer = b; s.playbackRate.value = .96 + Math.random() * .08; g.gain.value = Math.max(0, Math.min(1, v)) * .7; s.connect(g).connect(c.destination); s.start(T); },
    // what the crowd line under a result says, played back: cheers, applause, boos, or nothing when the crowd is flat
    react(s, k = .5) { if (!on()) return;
      const R = { cheer: () => this.crowd('applause', .5 + .4 * k), pop: () => this.crowd('cheer', .7 + .3 * k), chant: () => this.crowd('cheer', .7 + .3 * k),
        ovation: () => { this.crowd('cheer', 1); this.crowd('applause', .8, 1.2); }, polite: () => this.crowd('applause', .35),
        boo: () => this.crowd('boo', .45 + .5 * k), jeer: () => this.crowd('boo', .5 + .5 * k), mixed: () => this.crowd('boo', .4),
        chaos: () => { this.crowd('ooh', .9); this.crowd('cheer', .7, .9); }, champF: () => { this.crowd('cheer', 1); this.crowd('applause', .8, 1.5); }, champH: () => this.crowd('boo', 1) };
      (R[s] || (() => {}))(); },
  };
})();

// ---------- menu music: a rotating playlist of recorded tracks (credits in README and About) ----------
// Never starts before the player taps or presses a key, stays off when sound is muted,
// fades out for the live show (bell and crowd take over) and pauses when the app is hidden.
const MUSIC = (() => {
  const SRC = ['sounds/music-summon-the-rawk.mp3', 'sounds/music-raw.mp3', 'sounds/music-take-the-lead.mp3'];
  let el = null, gain = null, unlocked = false, want = false, fadeT = 0, cur = Math.floor(Math.random() * SRC.length);
  const on = () => meta.sound !== false && meta.music !== false;
  const vol = () => clamp(meta.musicVol == null ? .35 : +meta.musicVol, 0, 1);
  const quiet = () => document.hidden || UI.modal?.type === 'live';
  const level = v => { if (gain) gain.gain.value = v; else if (el) el.volume = v; };
  const make = () => { if (el) return el; el = new Audio(); el.src = SRC[cur]; el.preload = 'none'; el.setAttribute('playsinline', '');
    // when a track ends, the next one starts (at full music volume, no fade needed)
    el.addEventListener('ended', () => { cur = (cur + 1) % SRC.length; el.src = SRC[cur]; if (want) el.play().catch(() => {}); });
    // route through Web Audio where possible, because iPhones ignore the volume of a plain audio element
    try { const C = window.AudioContext || window.webkitAudioContext; if (C) { const c = MUSIC.ctx || (MUSIC.ctx = new C()); gain = c.createGain(); c.createMediaElementSource(el).connect(gain).connect(c.destination); } } catch (e) { gain = null; }
    return el; };
  const fade = (to, ms, done) => { clearInterval(fadeT); const from = gain ? gain.gain.value : el.volume, t0 = Date.now();
    fadeT = setInterval(() => { const k = Math.min(1, (Date.now() - t0) / ms); level(from + (to - from) * k); if (k >= 1) { clearInterval(fadeT); done && done(); } }, 40); };
  return {
    // called after every screen change and setting change
    sync() { want = unlocked && on() && !quiet() && vol() > 0;
      if (want) { const a = make(); if (MUSIC.ctx?.state === 'suspended') MUSIC.ctx.resume(); if (a.paused) { level(0); a.play().then(() => fade(vol(), 1200)).catch(() => {}); } else fade(vol(), 300); }
      else if (el && !el.paused) fade(0, 700, () => { if (!want) el.pause(); }); },
    unlock() { if (unlocked) return; unlocked = true; this.sync(); },
    get playing() { return !!el && !el.paused; },
  };
})();
