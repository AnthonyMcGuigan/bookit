# Builds the BookIt iPhone app in the cloud on a Mac (Codemagic), so no Mac of your own is needed.
# Setup steps are in ios-app/README.md. Start a build from codemagic.io → BookIt → ios-release → Start new build.
workflows:
  ios-release:
    name: BookIt iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: BookIt App Store Connect key   # the name you give the API key in Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bookitsim.game
      vars:
        APP_STORE_APPLE_ID: 0   # replace with the app's Apple ID number from App Store Connect
      node: 22
      xcode: latest
    triggering:
      events: []   # manual builds only
    scripts:
      - name: Copy the game into the app
        script: cd ios-app && npm ci && npm run sync
      - name: Signing
        script: xcode-project use-profiles
      - name: Build number
        script: |
          cd ios-app/ios/App
          agvtool new-version -all $(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
      - name: Build
        script: xcode-project build-ipa --project ios-app/ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
